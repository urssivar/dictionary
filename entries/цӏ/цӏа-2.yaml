headword: цӏа
ipa: ˈtsʼa
tags: [adv]

definitions:
  - translation:
      en: perfectly
      ru: идеально
    examples:
      - text: цӏа журуккле
        translation:
          en: perfectly round
          ru: идеально круглый
      - text: цӏа лакк бәӏруме
        translation:
          en: perfectly vertical walls
          ru: идеально вертикальные стены
