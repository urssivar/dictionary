headword: тәп
ipa: ˈtæp
tags: [adv]

definitions:
  - translation:
      en: exactly, just
      ru: точно, совсем
    examples:
      - text: Тәп и гон це ила урши ра.
        translation:
          en: Jour son is just like you.
          ru: Точно как ты и твой сын.
      - text: Тәп барҳле мәлацци чибеғив.
        translation:
          en: Hit exactly right into the window.
          ru: Попало совсем прямо в окно.
