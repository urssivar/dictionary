headword: тәәл
ipa: ˈtææl
tags: [adv, loan, arabic]
etymology:
  en: Adv. of *тяяр* "way".
note:
  en: "*тяьялла*"
definitions:
  - translation:
      en: as
      ru: как
    aliases:
      en: [like]
    examples:
      - text: ди тәәл дате
        translation:
          en: leave as is
      - text: аттал иран тәәл бара
        translation:
          en: do as father says
