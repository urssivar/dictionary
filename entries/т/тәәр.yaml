tags: [n, loan, arabic]
note:
  en: "*тяьяр*"
forms:
  - text: тәәр
    gloss: abs
  - text: тәәрте
    gloss: pl
definitions:
  - translation:
      en: condition
      ru: положение
    aliases:
      en: [state]
    examples:
      - text: ци тәәр би йа ила?
        translation:
          en: how are you doing?
  - translation:
      en: method
      ru: способ
    aliases:
      en: [manner, way, approach]
    examples:
      - text: ил иран тәәр әхице акку
        translation:
          en: the method you say is not good
