headword: гонне
ipa: gʷanˈne
tags: [adv]
etymology:
  en: Adv. of *гон* "like".
definitions:
  - translation:
      en: approximately
      ru: примерно, около
    aliases:
      en: [around, about]
    examples:
      - text: ца сӕӕтли гонне таман бирһонне
        translation:
          en: will finish in about an hour
