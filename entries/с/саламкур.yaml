headword: саламкур
ipa: salamˈkuɾ
tags: [n]
forms:
  - text: саламкурте
    gloss: pl

definitions:
  - note:
      en: Asking how someone's doing, etc.
    translation:
      en: greeting
      ru: приветствие
    aliases:
      en: [reception]
    examples:
      - text: вә саламкур дара һелттай
        translation:
          en: go greet them

etymology:
  en: The first part is Arabic loan, the *кур* is likely related to *кув* "language", cf. *цьику* "news".

variants: [саламкув, йәхшихуш]
