headword: саҡҡла
ipa: ˈsaqːla
tags: [adv]

definitions:
  - translation:
      en: yet
      ru: пока
    aliases:
      en: [for, now]
    examples:
      - text: саҡла варццул аккод
        translation:
          en: i'm not tired yet
      - text: саҡла һеж бара
        translation:
          en: do this for now

derived_from: [саҡҡ]
