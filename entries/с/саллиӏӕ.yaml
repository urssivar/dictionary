headword: саллиӏӕ
ipa: salliˈʔæ
tags: [n]
etymology:
  en: Related to *сағли* "in front" (cf. *ваччриъя* "trader").
forms:
  - text: саллиӏӕ
    gloss: abs
  - text: саллиӏне
    gloss: pl
definitions:
  - translation:
      en: leader
      ru: лидер
    aliases:
      en: [chief, main, principal]
    examples:
      - text: азирла саллиӏӕ виһов
        translation:
          en: may he be the leader of a thousand
