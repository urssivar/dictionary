headword: кӏуней
ipa: kʼuˈnej
tags: [intj]
definitions:
  - translation:
      en: whatchamacallit
      ru: это же, это самое
    examples:
      - text: цилла йа һеж? цилла кӏуней...
        translation:
          en: what is it from? from whatchamacallit...

### кӏунейла
### һел ттавттар цаҡҡа, котти кӏуней дами уццил беччив.
