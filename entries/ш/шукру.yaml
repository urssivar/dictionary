headword: шикур
ipa: ˈʃikuɾ
tags: [n, loan, arabic]

definitions:
  - translation:
      en: gratitude to God
      ru: благодарность Богу
    aliases:
      en: [praise]
      ru: [хвала]
    examples:
      - text: Аллаһцци шикур!
        translation:
          en: Thank God!
          ru: Слава Богу!

variants: [шукур, шикру, шукру]
