headword: әва
ipa: ˈæβa
tags: [adj]

definitions:
  - translation:
      en: oily, fatty
      ru: жирный, масляный
    tags: [food, body]
    examples:
      - text: Читтинег әвал це.
        translation:
          en: Sour cream is fatty.
          ru: Сметана жирна.
      - text: Дигулли дила нәҡҡбе әва диһухәв.
        translation:
          en: The meat made my hands greasy.
          ru: Из-за мяса мои руки стали жирными.
