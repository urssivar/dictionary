headword: әвбаг
ipa: æβˈbag
tags: [adj, cls]

definitions:
  - translation:
      en: ternary
      ru: троичный
    aliases:
      en: [three, triple]
      ru: [три, тройственный]
    examples:
      - text: Чӏәҡӏо әвбагле кабалға.
        translation:
          en: Cut the bread into thirds.
          ru: Разрежь хлеб натрое.

derived_from: [әбал, баг]
