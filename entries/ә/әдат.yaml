headword: әдат
ipa: æˈdat
tags: [n, loan, arabic]
forms:
  - text: әдате
    gloss: pl

definitions:
  - translation:
      en: custom, practice
      ru: обычай, практика
    examples:
      - text: һана әдате
        translation:
          en: current customs
          ru: нынешние обычаи
      - text: Ца әдати гон миҡҡ барив.
        translation:
          en: They held a wedding, as if just for the sake of appearances.
          ru: Сыграли свадьбу будто для приличия.

etymology:
  en: From Arabic عَادَة (*ʕāda*) "custom, habit".
  ru: От арабского عَادَة (*ʕāda*) "обычай, привычка".
