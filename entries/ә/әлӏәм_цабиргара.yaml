headword: әлӏәм цабиргара
ipa: ælˌʔæm tsabiɾˈgaɾa
tags: [v, ntr, cls]
forms:
  - text: цабигара
    gloss: pfv
  - text: цабижив
    gloss: pret

definitions:
  - translation:
      en: to coil up
      ru: скручиваться
    examples:
      - text: Мәлӏум әлӏәм цабижил де баригу.
        translation:
          en: The snake was coiled up and lying in the sun.
          ru: Змей скрутился и лежал под солнцем.

derived_from: [әлӏәм, биргара]
