headword: әлда биркара
ipa: ˌælda biɾˈkaɾa
tags: [v, cls, ntr]
forms:
  - text: бикара
    gloss: pfv
  - text: бичив
    gloss: pret

definitions:
  - translation:
      en: to lie down
      ru: ложиться
    examples:
      - text: Бизи халчани әлда бичив.
        translation:
          en: The cat lay down on the carpet.
          ru: Кошка прилегла на ковре.
