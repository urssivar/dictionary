headword: әлутӏа
ipa: æˈlutʼa
tags: [n]
forms:
  - text: әлутӏан
    gloss: obl
  - text: әлутӏне
    gloss: pl

definitions:
  - translation:
      en: ring
      ru: кольцо
    examples:
      - text: Пичла әлутӏа чи кабиҳҳа.
        translation:
          en: Put the stove ring back in place.
          ru: Положи печное кольцо на место.

derived_from: [әла]
variants: [әлутӏай, әвлутӏ]
