headword: әвку
ipa: ˈæβku
tags: [n]
forms:
  - text: әвкурте
    gloss: pl

definitions:
  - translation:
      en: verse, poetry
      ru: стих, поэзия
    examples:
      - text: әвкурте делчӏана
        translation:
          en: to read poetry
          ru: прочесть стихи

derived_from: [әбал, кув]
variants: [әвкув, әвкур]
see_also: [цӏику]
