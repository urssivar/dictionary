headword: әм
ipa: ˈæm
tags: [n]
forms:
  - text: әмре
    gloss: pl

definitions:
  - translation:
      en: fold, curve, ripple
      ru: складка, изгиб, волна
    examples:
      - text: әм һабижив
        translation:
          en: The cow arched its back due to stomach pain.
          ru: Из-за боли в животе корова выгнулась.
