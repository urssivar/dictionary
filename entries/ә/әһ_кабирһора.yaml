headword: әһ кабирһора
ipa: ˌæh kabiɾˈhʷaɾa
tags: [v, tr, cls]
forms:
  - text: кабиһора
    gloss: pfv
  - text: кабиһәв
    gloss: pret

definitions:
  - translation:
      en: to recover, to heal
      ru: выздоравливать
    examples:
      - text: Зәипле калгун де, на әһ киһәл це.
        translation:
          en: He was ill, but he has recovered.
          ru: Он болел, но уже выздоровел.

derived_from: [әһ, бирһора]
