headword: әһ кабирццара
ipa: ˌæh kabiɾˈtsːaɾa
tags: [v, cls, ntr]
forms:
  - text: кабиццара
    gloss: pfv
  - text: кабиццур
    gloss: pret

definitions:
  - translation:
      en: to like
      ru: нравиться
    tags: [emotion]
    examples:
      - text: Дами һеж ҡати әһ кабирццул акку.
        translation:
          en: I don't like this hat.
          ru: Мне не нравится эта шапка.

derived_from: [әһ, бирццара]
