headword: әдав
ipa: æˈdaβ
tags: [n, loan]

definitions:
  - translation:
      en: inconvenience, discomfort
      ru: неудобство, дискомфорт
    tags: [emotion]
    examples:
      - text: Чакма цӏаҡӏле әдавле це, дуҡҡара гон акку.
        translation:
          en: The boots are very uncomfortable; they can’t be worn.
          ru: Сапоги очень неудобны; не поносить.
  - translation:
      en: sadness, heaviness, grief
      ru: печаль, тягость, горе
    tags: [emotion]
    examples:
      - text: Ваһла һеккил вевкӏне ерин әдав цикӏал це.
        translation:
          en: The death of a close one is an incredibly difficult experience, morally speaking.
          ru: Смерть близкого человека совершенно печальная вещь.

etymology:
  en: From Arabic عَذَاب (*ʕaḏāb*) "torture, torment".
  ru: От арабского عَذَاب (*ʕaḏāb*) "пытка, мучение".

see_also: [әзав]
