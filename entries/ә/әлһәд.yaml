headword: әлһәд
ipa: ælˈhæd
tags: [n, loan, arabic]
forms:
  - text: әлһәде
    gloss: pl

definitions:
  - translation:
      en: week
      ru: неделя
    tags: [time]
    examples:
      - text: Чӏвел әлһәд дегул де.
        translation:
          en: Two weeks had passed.
          ru: Прошло две недели.

variants: [жумәӏ]
