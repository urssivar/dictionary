headword: әвачӏаҡӏо
ipa: ˈæβatʃʼaqʼʷa
tags: [n]
forms:
  - text: әвачӏаҡӏон
    gloss: obl
  - text: әвачӏиҡӏне
    gloss: pl

definitions:
  - translation:
      en: puff bread
      ru: слоёный хлеб
    tags: [food]
    examples:
      - text: Дуҡҡа һештти әвачӏаҡӏо.
        translation:
          en: Take these puff breads.
          ru: Отнеси эти слоеные хлеба.

derived_from: [әва, чӏаҡӏо]
variants: [кимрәҡҡ, берккуре]
