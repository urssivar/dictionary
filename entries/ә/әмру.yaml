headword: әмру
ipa: ˈæmɾu
tags: [n, loan, arabic]
forms:
  - text: әмрул
    gloss: obl
  - text: әмрубе
    gloss: pl

definitions:
  - translation:
      en: age
      ru: возраст
    examples:
      - text: әмрулцци веғив
        translation:
          en: пожилой
          ru: elderly
  - translation:
      en: life
      ru: жизнь
    examples:
      - text: Дуҡен әмру!
        translation:
          en: Long life!
          ru: Долгой жизни!
      - text: Әмру деркӏора кукил акку.
        translation:
          en: Living a life is not easy.
          ru: Прожить жизнь — нелегко.

variants: [әнру]
