headword: әмру
ipa: ˈæmɾu
tags: [n, loan, arabic]
etymology:
  en: "*янру*"
forms:
  - text: әмру
    gloss: abs
  - text: әмрул
    gloss: obl
definitions:
  - translation:
      en: age
      ru: возраст
    aliases:
      en: [living]
    examples:
      - text: әмрулцци веғив
        translation:
          en: elderly
  - translation:
      en: life
      ru: жизнь
    examples:
      - text: әмру деччив
        translation:
          en: lived long
      - text: әмру деркӏора
        translation:
          en: to spend life
