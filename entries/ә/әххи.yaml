headword: әххи
ipa: æˈχːi
tags: [adj]

definitions:
  - translation:
      en: good
      ru: хороший
    examples:
      - text: Һеж әххи дарман ца бичив; буссәәт әһ варивда.
        translation:
          en: This medicine turned out to be good; it immediately cured me.
          ru: Это лекарство оказалось хорошим; сразу вылечило меня.
