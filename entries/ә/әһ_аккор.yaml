headword: әһ аккор
ipa: ˌæh aˈkːʷaɾ
tags: [adj]

definitions:
  - translation:
      en: useless
      ru: бесполезный
    examples:
      - text: Цилла-ра әһ аккор це. 
        translation:
          en: He's completely useless.
          ru: Он совсем бесполезный.
            
derived_from: [әһ, аккор]
