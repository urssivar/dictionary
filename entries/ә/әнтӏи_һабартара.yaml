headword: әнтӏи һабартара
ipa: ænˌtʼi habaɾˈtaɾa
tags: [v, cls, tr]
forms:
  - text: һабатара
    gloss: pfv
  - text: һабатур
    gloss: pret

definitions:
  - translation:
      en: to pamper, to spoil
      ru: баловать, изнеживать
    examples:
      - text: һар һакка биӏивил малукка, әнтӏи маһарта.
        translation:
          en: Don’t give him everything he asks for; don’t spoil him.
          ru: Не давай всё, о чём просит, не балуй его.

derived_from: [әнтӏи, бартара]
