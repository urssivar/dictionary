headword: әрчмикк
ipa: æɾtʃˈmikː
tags: [n]
forms:
  - text: әрчмикке
    gloss: pl

definitions:
  - translation:
      en: whip, lash
      ru: кнут, хлыст
    tags: [tool]
    examples:
      - text: Йәбуй әрчмикке чи кадәҡив.
        translation:
          en: They urged the horse on with a whip.
          ru: Погнали лошадь кнутом.
