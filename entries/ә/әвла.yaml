headword: әвла
ipa: ˈæβla
tags: [n]
forms:
  - text: әвлан
    gloss: obl
  - text: әвлуме
    gloss: pl

definitions:
  - translation:
      en: number three
      ru: тройка
    examples:
      - text: Һеж ил барив әчули әвла аккор кабатара авирһид дул.
        translation:
          en: For this work you’ve done, I can only give you a three.
          ru: За эту проделанную тобой работу я могу поставить только тройку.

derived_from: [әбал]
