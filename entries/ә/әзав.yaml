headword: әзав
ipa: æˈzaβ
tags: [n, loan, arabic]

definitions:
  - translation:
      en: torture
      ru: пытка
    examples:
      - text: әзав кабирара
        translation:
          en: to torture
          ru: пытать

etymology:
  en: From Arabic عَذَاب (*ʕaḏāb*) "torture, torment".
  ru: От арабского عَذَاب (*ʕaḏāb*) "пытка, мучение".

see_also: [әдав]
