headword: әмал аргара
ipa: æˌmal aɾˈgaɾa
tags: [v, ntr]
forms:
  - text: агара
    gloss: pfv
  - text: агур
    gloss: pret

definitions:
  - translation:
      en: to manage, to work out
      ru: обходиться, получаться
    examples:
      - text: На һеж ҡҡуллуҡҡла ра ца әмал агур.
        translation:
          en: Well, now this matter has somehow worked out too.
          ru: Ну, теперь и это дело кое-как получилось.

derived_from: [әмал, аргара]
