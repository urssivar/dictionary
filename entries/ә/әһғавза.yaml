headword: әһғавза
ipa: ˈæhʁaβza
tags: [n]
forms:
  - text: әһғивзне
    gloss: pl

definitions:
  - translation:
      en: mensch, good man
      ru: настоящий мужчина
    examples:
      - text: Әһғавза вирһи нишшала ххолатта.
        translation:
          en: Your grandfather was a real man.
          ru: Ваш дедушка был настоящим мужчиной.

derived_from: [әһ, ғавза]
