headword: әй кабиргара
ipa: ˌæj kabiɾˈgaɾa
tags: [v, ntr, cls]
forms:
  - text: кабигара
    gloss: pfv
  - text: кабижив
    gloss: pret

definitions:
  - translation:
      en: to spread, to sprawl
      ru: распространяться, расползаться
    examples:
      - text: Еҡӏе майдани ттакӏин әй кабижив.
        translation:
          en: The herd spread out across the field.
          ru: Стадо распространилось по полю.

derived_from: [әй, биргара]
