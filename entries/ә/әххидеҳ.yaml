headword: әххидеҳ
ipa: æχːiˈdex
tags: [n]
forms:
  - text: әххидеҳҳе
    gloss: pl

definitions:
  - translation:
      en: use, suitability, quality
      ru: польза, подходящесть, добротность
    examples:
      - text: Һеж ҳҳулуми һеж кӏанала ра әххидеҳ.
        translation:
          en: How good this headscarf looks on this woman.
          ru: Как же хорош этот платок для этой женщины.

derived_from: [әххи]
