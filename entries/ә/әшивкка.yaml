headword: әшивкка
ipa: æʃiβˈkːa
tags: [n, loan, russian]
forms:
  - text: әшивккан
    gloss: obl
  - text: әшивккне
    gloss: pl

definitions:
  - translation:
      en: error, typo
      ru: ошибка, опечатка
    examples:
      - text: Һеж ил белкӏунилцци әшивкка би һежин.
        translation:
          en: There is an error here in this writing of yours.
          ru: Здесь в этой твоей записи есть ошибка.

variants: [әшипкка]
