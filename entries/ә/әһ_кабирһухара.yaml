headword: әһ кабирһухара
ipa: ˌæh kabiɾˈhuχaɾa
tags: [v, tr, cls]
forms:
  - text: кабиһухара
    gloss: pfv
  - text: кабиһухәв
    gloss: pret

definitions:
  - translation:
      en: to appease, to cajole
      ru: задабривать, ублажать
    examples:
      - text: Һел ила ушттил әһ кариһухара биччеттен, цәәһ ҡҡампитала пәшкка цаҡҡил бекка.
        translation:
          en: If you want to appease your teacher, bring her a box of nice chocolates.
          ru: Если ты хочешь задобрить эту твою учительницу, принеси и дай ей пачку хороших конфет.
            
derived_from: [әһ, бирһухара]
