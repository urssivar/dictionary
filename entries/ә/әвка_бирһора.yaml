headword: әвка бирһора
ipa: æβˌka biɾˈhʷaɾa
tags: [v, ntr, cls]
forms:
  - text: биһора
    gloss: pfv
  - text: биһәв
    gloss: pret

definitions:
  - translation:
      en: to be exhausted, to be extremely tired
      ru: измучиваться, предельно уставать
    examples:
      - text: Улшун әвка виһәвда.
        translation:
          en: I was exhausted working.
          ru: Я измучился работая.

derived_from: [әбал, бирһора]
variants: [буҡӏе ~]
