headword: әла
ipa: ˈæla
tags: [n]
forms:
  - text: әлун
    gloss: obl
  - text: әлме
    gloss: pl

definitions:
  - translation:
      en: wheel
      ru: колес
    tags: [technology]
    examples:
      - text: Аттал әла давкк барив.
