headword: әвцӏали
ipa: æβˈtsʼali
tags: [num]
forms:
  - text: әвцӏал
    gloss: obl
  - text: әвцӏа
    gloss: root

definitions:
  - translation:
      en: thirty
      ru: тридцать
    examples:
      - text: Әвцӏали бар дегул це.
        translation:
          en: Thirty days have passed.
          ru: Прошло тридцать дней.

derived_from: [абал, вецӏал]
variants: [әвцӏал]
