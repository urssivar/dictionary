headword: әжи
ipa: æˈʒi
tags: [n, loan, turkic]
forms:
  - text: әжихал
    gloss: pl

definitions:
  - translation:
      en: respected elder woman
      ru: уважаемая пожилая
    tags: [culture]
    aliases:
      en: [mrs, aunt, old]
      ru: [тетя, старуха]
    examples:
      - text: Һеж әжи ниссала умра це.
        translation:
          en: This elderly woman is our neighbor.
          ru: Эта пожилая женщина — наша соседка.

variants: [әйжи, әжа]
