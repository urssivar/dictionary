headword: әппа иҡара
ipa: æˌpːa iˈqaɾa
tags: [v, tr]
forms:
  - text: аҡара
    gloss: pfv
  - text: аҡив
    gloss: pret

definitions:
  - translation:
      en: to put on one's back
      ru: усадить на спину
    tags: [child]
    examples:
      - text: Һари, әппа аҡе.
        translation:
          en: Come on, hop on my back.
          ru: А ну, садись на спину. 

variants: [аппа ~]
