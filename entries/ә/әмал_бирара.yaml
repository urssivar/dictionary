headword: әмал бирара
ipa: æˌmal biˈɾaɾa
tags: [v, tr, cls]
forms:
  - text: барара
    gloss: pfv
  - text: барив
    gloss: pret

definitions:
  - translation:
      en: to settle, to manage
      ru: улаживать, разрешать
    examples:
      - text: Дул әмал баривда.
        translation:
          en: I managed.
          ru: Я справился.

derived_from: [әмал, бирара]
