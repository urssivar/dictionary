headword: әбал-ра
ipa: ˈæbal-ɾa
tags: [num, n]
forms:
  - text: әвлел
    gloss: obl

definitions:
  - translation:
      en: all three
      ru: трое
    examples:
      - text: Әбал-ра уцци цанццил һер бирһор.
        translation:
          en: The three brothers live together.
          ru: Братья живут вместе втроём.

derived_from: [әбал]
variants: [әбал-әбалле]
