headword: әһле
ipa: ˈæhle
tags: [intj]

definitions:
  - translation:
      en: okay, alright, fine
      ru: ладно, хорошо, ок
    examples:
      - text: Әһле, дул һел биранда.
        translation:
          en: Alright, I’ll do it.
          ru: Хорошо, я это сделаю.

derived_from: [әһ]
variants: [йәхши]
