headword: әшакк
ipa: æˈʃakː
tags: [n]
forms:
  - text: әшаккан
    gloss: loc
  - text: әшикке
    gloss: pl

definitions:
  - translation:
      en: pot
      ru: кастрюля
    tags: [tool]
    examples:
      - text: Әшакки бурта чи кабиҳҳа.
        translation:
          en: Put the lid on the pot.
          ru: Накрой кастрюлю крышкой.

variants: [әшаккне-]
