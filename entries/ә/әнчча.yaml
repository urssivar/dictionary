headword: әнчча
ipa: ˈæntʃːa
tags: [n]
forms:
  - text: әнччин
    gloss: obl
  - text: әнччирбе
    gloss: pl

definitions:
  - translation:
      en: clay
      ru: глина
    tags: [nature]
    examples:
      - text: цӏәв әнчча
        translation:
          en: gypsum
          ru: гипс
      - text: Буршлила әнчча
        translation:
          en: clay from Bashlykent (gypsum)
          ru: башлыкентская глина (гипс)
      - text: итӏин әнчча
        translation:
          en: red clay
          ru: красная глина
  - translation:
      en: soil
      ru: почва
    examples:
      - text: Һеж ҡуцци цикӏал аарган әнчча це.
        translation:
          en: The soil in this field is infertile.
          ru: В этом поле неплодорожная почва.
