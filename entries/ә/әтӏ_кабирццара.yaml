headword: әтӏ кабирццара
ipa: ˌætʼ kabiɾˈtsːaɾa
tags: [v, ntr, cls]
forms:
  - text: кабиццара
    gloss: pfv
  - text: кабиццур
    gloss: pret

definitions:
  - translation:
      en: to lean toward falling, to tilt, lopside
      ru: наклоняться к падению, перекашиваться
    examples:
      - text: Машин цәәһле әтӏ кабиццур, амма акабичив.
        translation:
          en: The vehicle tilted quite sharply, but it didn't fall over.
          ru: Машина довольно сильно наклонилась, но не упала.

derived_from: ["*әтӏ", бирццара]
