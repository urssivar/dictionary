headword: әжавле
ipa: æˈʒaβle
tags: [adv]

definitions:
  - translation:
      en: surely, of course
      ru: обязательно, конечно
    examples:
      - text: Әжавле ваҳанда, цили авашида йе?
        translation:
          en: Of course I’ll go — why wouldn’t I?
          ru: Конечно пойду, почему не пойти?

derived_from: [әжав]
