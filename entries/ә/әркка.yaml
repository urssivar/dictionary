headword: әркка
ipa: ˈæɾkːa
tags: [adj]

definitions:
  - translation:
      en: sick, unwell
      ru: больной, недомогающий
    examples:
      - text: Ҡуцци вәрӏил әркка виһәвда.
        translation:
          en: I caught a cold out in the field and now I’m sick.
          ru: Простыл в поле и теперь болею.
