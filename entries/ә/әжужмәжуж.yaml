headword: әжужмәжуж
ipa: æˌʒuʒmæˈʒuʒ
tags: [n, loan, arabic]

definitions:
  - translation:
      en: chaos, disorder
      ru: хаос, беспорядок

etymology:
  en: From Arabic يَأْجُوج وَمَأْجُوج (*yaʔjūj wa-maʔjūj*) "Gog and Magog".
  ru: От арабского يَأْجُوج وَمَأْجُوج (*yaʔjūj wa-maʔjūj*) "Яджудж и Маджудж".
