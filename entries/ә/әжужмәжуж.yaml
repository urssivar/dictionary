headword: әжужмәжуж
ipa: æˌʒuʒmæˈʒuʒ
tags: [n, loan, arabic]

definitions:
  - translation:
      en: chaotic
      ru: хаотичный
    aliases:
      en: [disorder, bedlam]
      ru: [беспорядок, суматоха]

etymology:
  en: From Arabic يَأْجُوج وَمَأْجُوج (*yaʔjūj wa-maʔjūj*) "Gog and Magog".
  ru: От арабского يَأْجُوج وَمَأْجُوج (*yaʔjūj wa-maʔjūj*) "Яджудж и Маджудж".
