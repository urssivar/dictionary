headword: әҡӏлу
ipa: ˈæqʼlu
tags: [n, loan, arabic]
forms:
  - text: әҡӏлун
    gloss: obl
  - text: әҡӏлуме
    gloss: pl

definitions:
  - translation:
      en: intelligence, mind, reason
      ru: разум, ум, интеллект
    examples:
      - text: Әрҡӏола се әҡӏлу би.
        translation:
          en: Has the brains of a chicken.
          ru: Ума как у курицы.
      - text: Һеж цинна әҡӏлуни мешул шиҡӏ цикӏул це.
        translation:
          en: He behaves in a manner commensurate with his intelligence.
          ru: Он ведёт себя соразмерно своему уму.
  - translation:
      en: advice, edification
      ru: совет, наставление
    examples:
      - text: әҡӏлуме чи дурсара
        translation:
          en: to give advice
          ru: давать советы
