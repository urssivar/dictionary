headword: әницц
ipa: æˈnitsː
tags: [n]
forms:
  - text: әнцце
    gloss: obl
  - text: әнцциппе
    gloss: pl

definitions:
  - translation:
      en: spring
      ru: родник
    tags: [nature]
    aliases:
      en: [water, source]
      ru: [вода, источник]
    examples:
      - text: Әнццела һехав ччакко шшамул ди дачӏил.
        translation:
          en: Below the spring, there grows some good-quality mint.
          ru: Там ниже родника растёт добротная мята.
