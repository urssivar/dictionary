headword: әлда бирццара
ipa: ˌælda biɾˈtsːaɾa
tags: [v, ntr, cls]
forms:
  - text: биццара
    gloss: pfv
  - text: биццур
    gloss: pret

definitions:
  - translation:
      en: to wind up (for a swing or a blow)
      ru: замахиваться (для удара)
    examples:
      - text: Әлда виццул ххат цабәҡив.
        translation:
          en: He wound up and delivered a slap.
          ru: Размахнулся и дал пощечину.
