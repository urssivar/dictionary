headword: әй
ipa: ˈæj
tags: [adj]

definitions:
  - translation:
      en: разбросанный, распределённый
      ru: scattered, distributed
    examples:
      - text: Һежела холтӏе әйле дирһор һарзаман, һар һав лакӏ дарил.
        translation:
          en: His clothes are constantly left scattered about, strewn in every direction.
          ru: Его одежда постоянно бывает разбросана, раскинута во все стороны.
