headword: әһ кабирара
ipa: ˌæh kabiˈɾaɾa
tags: [v, tr, cls]
forms:
  - text: кабарара
    gloss: pfv
  - text: кабарив
    gloss: pret

definitions:
  - translation:
      en: to heal, to cure
      ru: лечить, исцелять
    examples:
      - text: Баццел аккол әһ карара абиһәв; цӏаҡӏле зәипле де.
        translation:
          en: It took a whole month to cure him; he had been very ill.
          ru: Лишь за месяц смогли вылечить; сильно болел.

derived_from: [әһ, бирара]
