headword: әжав
ipa: æˈʒaβ
tags: [adj, det, loan]

definitions:
  - translation:
      en: weird, unusual
      ru: странный, необычный
    examples:
      - text: Әжав хабар би ҡӏал.
        translation:
          en: What an unusual story.
          ru: Какая же необычная история.
  - translation:
      en: such, so
      ru: такой, так
    examples:
      - text: әжав музи ҡәр
        translation:
          en: such a sweet pear
          ru: такая сладкая груша

etymology:
  en: From Arabic عَجَب (*ʕajab*) "wonder, marvel".
  ru: От арабского عَجَب (*ʕajab*) "чудо, диво".
