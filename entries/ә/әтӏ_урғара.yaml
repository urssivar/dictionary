headword: әтӏ урғара
ipa: ˌætʼ uɾˈʁaɾa
tags: [v, tr]
forms:
  - text: ағара
    gloss: pfv
  - text: ағив
    gloss: pret

definitions:
  - translation:
      en: to demolish, to collapse
      ru: сносить, обрушать
    examples:
      - text: Чӏуллелли чи биссун бәӏ әтӏ ағив. 
        translation:
          en: The two of them leaned against the wall and collapsed it.
          ru: Прислонились вдвоем и обрушили стену.

derived_from: ["*әтӏ", урғара]
