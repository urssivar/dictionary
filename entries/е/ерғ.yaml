headword: ерғ
ipa: ˈeɾʁ
tags: [n]
forms:
  - text: ирғбе
    gloss: pl

definitions:
  - translation:
      en: weather
      ru: погода
    examples:
      - text: Ерғ вәһи биһәв.
        translation:
          en: The weather turned bad.
          ru: Погода испортилась.
  - translation:
      en: season, period, time
      ru: сезон, пора, время
    examples:
      - text: ца ерғла
        translation:
          en: contemporary
          ru: одного времени
      - text: һел ерғи
        translation:
          en: by that time
          ru: к тому времени
      - text: дуссела ирғбе
        translation:
          en: seasons of the year
          ru: времена года

variants: [арғ, еғ]
