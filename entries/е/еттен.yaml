headword: еттен
ipa: eˈtːen
tags: [conj]
note:
  en: '*етта*, *аттен*'
definitions:
  - translation:
      en: than
      ru: чем
    aliases:
      en: [rather]
    examples:
      - text: Сса еттен ижал гунал це.
        translation:
          en: today it's warmer than yesterday
      - text: Ьинце еттен дами ҡяр диччихид.
        translation:
          en: i love pears more than apples
      - text: Ьежин кижил еттен вярун яьле аччу у?
        translation:
          en: wouldn't it been better to go than to sit here?
