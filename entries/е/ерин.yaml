headword: ерин
ipa: eˈɾin
tags: [adv]

definitions:
  - translation:
      en: entirely, totally
      ru: целиком, полностью
    examples:
      - text: Ерин вегул це.
        translation:
          en: He is entirely gone.
          ru: Он совсем ушёл.
      - text: Ерин кулпет цабағив.
        translation:
          en: The entire family arrived.
          ru: Полная семья прибыла.
  - translation:
      en: very
      ru: очень
    examples:
      - text: Ерин музи удар.
        translation:
          en: A very sweet fruit.
          ru: Очень сладкий фрукт.
