headword: би
ipa: ˈbi
tags: [adj, cls]
etymology:
  en: Cf. the copula *би* "to be".
definitions:
  - translation:
      en: existing
      ru: являющийся, имеющийся
    aliases:
      en: [available, being]
    examples:
      - text: һетин дите цаҡҡа
        translation:
          en: bring what's there
      - text: мӕҡӏе ви дӕрһӕцци бекка
        translation:
          en: give it to the child nearby
