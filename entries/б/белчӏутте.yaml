headword: белчӏутте
ipa: belˈtʃʼutːe
tags: [n]
forms:
  - text: белчӏуттне
    gloss: pl

definitions:
  - translation:
      en: education
      ru: образование
    tags: [social]
    aliases:
      en: [study]
      ru: [учёба]
    examples:
      - text: Әрасайцци вегур белчӏутте һассара.
        translation:
          en: Went to Russia to get education.
          ru: Отправился в Россию чтобы получить образование.

derived_from: [булчӏана]
