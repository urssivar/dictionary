headword: баӏ
ipa: ˈbaʔ
tags: [n]
forms:
  - text: биӏруме
    gloss: pl

definitions:
  - translation:
      en: edge
      ru: край
    aliases:
      en: [rim]
    examples:
      - text: карватла баӏи кижил ви
        translation:
          en: he's sitting at the edge
      - text: еркӏла баӏи
        translation:
          en: on the river bank
          ru: на берегу реки
  - translation:
      en: beginning
      ru: начало
