headword: биҡҡара
ipa: biˈqːaɾa
tags: [v, tr, cls]
forms:
  - text: буҡҡара
    gloss: pfv
  - text: буҡҡив
    gloss: pret
  - text: биҡҡара
    gloss: ipfv
definitions:
  - translation:
      en: to carry
      ru: относить
    aliases:
      en: [move]
    examples:
      - text: убаса дән ҡҡел һештти цӏидеҳ ра дуҡка
  - translation:
      en: уносить
    examples:
      - text: букӏумли сукке һадишур холтӏе дуҡҡив
      - text: ижал чиркала умрал нисала ҡӏәҡӏ буҡҡив
  - translation:
      en: носить, одевать
    examples:
      - text: һеж берттив ккуртте мабиҡҡатте
        translation:
          ru: не носи эту порванную рубашку
