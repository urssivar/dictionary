headword: бикӏора
ipa: biˈkʼʷaɾa
tags: [v, ntr, cls]
forms:
  - text: икӏора
    gloss: ipfv m
  - text: бикӏора
    gloss: ipfv
definitions:
  - translation:
      en: to speak
      ru: говорить
    aliases:
      en: [say]
    examples:
      - text: ниҳола ғайли цигле бикӏор ей һел?
        translation:
          en: how is it in our langauge?
      - text: һелттежил мабиратте, ду икӏул да
        translation:
          en: i mean
      - text: на ци дичӏида йе агурилла һереғ
  - translation:
      en: to mean
      ru: иметь ввиду, думать
    aliases:
      en: [speak, communicate]
    examples:
      - text: ду икӏул да, бажил абәәж

