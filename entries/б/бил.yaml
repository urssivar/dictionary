headword: бил
ipa: ˈbil
tags: [adv, cls]
definitions:
  - translation:
      en: being
      ru: будучи
    aliases:
      en: [existing]
    examples:
      - text: һелттел бил ҳарра аагур
        translation:
          en: despite it being so it didn't work
      - text: ду никӏол вил ҡҡел шилцци угаде
      - text: нисала холаттнала ҡилбе дилцци һана гәма агул ди
