headword: бурҡара
ipa: buɾˈqaɾa
tags: [v, tr, cls]
forms:
  - text: бӕҡара
    gloss: pfv
  - text: бӕҡив
    gloss: pret
  - text: бурҡара
    gloss: ipfv
definitions:
  - translation:
      en: to churn
      ru: взбивать
    examples:
      - text: нег дӕҡара
        translation:
          en: to churn milk
  - translation:
      en: to wound
      ru: ранить
    examples:
      - text: и һӕрһӕнли вӕҡ!
  - translation:
      en: to carry out
      ru: выполнять
    aliases:
      en: [perform, do, act]
    examples:
      - text: шутрацци дӕҡа
        translation:
          en: do [the math] on the abacus
      - text: аже дурҡанда
        translation:
          en: i will play the melody
