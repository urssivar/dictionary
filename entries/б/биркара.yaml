headword: биркара
ipa: biɾˈkaɾa
tags: [v, ntr, cls]
forms:
  - text: бикара
    gloss: pfv
  - text: бичив
    gloss: pret
  - text: биркара
    gloss: ipfv
definitions:
  - translation:
      en: to receive
      ru: попадаться, получать
    aliases:
      en: [get]
    examples:
      - text: һелей әһ ҳулум ричив
      - text: цӏидеҳ дицил дами әһ арц дичив
  - translation:
      en: to occur
      ru: наступать, оказываться
    aliases:
      en: [turn, arrive]
    examples:
      - text: сәәт швел дичил це
        translation:
          en: it's 5 o'clock already
