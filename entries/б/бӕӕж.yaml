headword: бӕӕж
ipa: ˈbææʒ
tags: [cop, vb]
etymology:
  en: From hyp. of *бирьора* "to be" (cf. *биьяж* "probable").
note:
  en: "*биьяж*, *биьяй*"
forms:
  - text: бӕӕда
    gloss: 1, 2 pl
  - text: бӕӕде
    gloss: 2 abs, pst
  - text: бӕӕж
    gloss: "3"
definitions:
  - translation:
      en: likely
      ru: скорее всего
    aliases:
      en: [maybe, perhaps, probalby]
    examples:
      - text: һеж тилпун убала бӕӕж
        translation:
          en: this phone is likely mother's
      - text: атта ҡил вӕӕж
        translation:
          en: father is likely at home
