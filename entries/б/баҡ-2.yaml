headword: баҡ
ipa: ˈbaq
tags: [adv]

definitions:
  - translation:
      en: too, overly
      ru: слишком, чересчур
    aliases:
      en: [overly, much]
    examples:
      - text: Баҡ ӕвра ғай дарив ҡӏал.
        translation:
          en: Talked well too much.
          ru: Чересчур много же разговаривал.
      - text: Баҡ дурҡал це ассара.
        translation:
          en: Too expensive to buy.
          ru: Слишком дорого, чтобы купить.
