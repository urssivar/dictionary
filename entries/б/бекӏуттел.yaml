headword: бекӏуттел
ipa: ˈbekʼutːel
tags: [adv]
etymology:
  en: From *бекь* "head", the second part is related to *гуни* "below".
variants: [бекӏ гуттер, бекӏ саттинне]
definitions:
  - translation:
      en: upside down
      ru: вверх ногами
    aliases:
      en: [bottom, up]
    examples:
      - text: ттартт бәҡил бекӏуттел кагур
