headword: бел
ipa: ˈbel
tags: [cop, adj, cls]
etymology:
  en: Related to copula *би* "to be".
definitions:
  - translation:
      en: still is
      ru: ещё есть
    aliases:
      en: [remain]
    examples:
      - text: ҡил гоза бел абәәж
        translation:
          en: there was still honey
      - text: атта һелин вел ваал ду ра цаҳанда
        translation:
          en: if father is still there i will come too
