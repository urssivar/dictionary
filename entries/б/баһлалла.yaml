headword: баһлалла
ipa: ˈbahlalla
tags: [adj]

definitions:
  - translation:
      en: the most
      ru: пресамый
    examples:
      - text: һана һеж хурег баһлалла сар һәсив бирул да
        translation:
          en: now i'm trying this meal for the first time
      - text: Баһлалла сар һеж веғив.
derived_from: [баһ-2]
