headword: бара
ipa: baˈɾa
tags: [adv]
definitions:
  - translation:
      en: nearly
      ru: чуть
    aliases:
      en: [just, almost]
    examples:
      - text: нерғ бара бел һәдур биһора
        translation:
          en: she nearly fell
      - text: бара бара ачибеғив
        translation:
          en: she nearly fell
      - text: һана бара вегур
        translation:
          en: he departed just now
