headword: баьутте
ipa: baˈhutːe
tags: [n, vb]
forms:
  - text: баьуттне
    gloss: pl

definitions:
  - translation:
      en: experience, knowledge
      ru: опыт, знание
    aliases:
      en: [education]
      ru: [образование]
    examples:
      - text: Ьелецци баьутте би.
        translation:
          en: He has experience.
          ru: У него есть опыт.

derived_from: [барьара]
