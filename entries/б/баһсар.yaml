headword: баһсар
ipa: ˈbahsaɾ
tags: [adv]
etymology:
  en: '*баь* "the most" + *сар* "before"'
note:
  en: '*басар*'
definitions:
  - translation:
      en: initially
      ru: сперва
    aliases:
      en: [first]
    examples:
      - text: баһсар һеж бара, цӏил һет бара
        translation:
          en: first do this
