headword: бурцара
ipa: buɾˈtsaɾa
tags: [v, tr, cls]
forms:
  - text: буцара
    gloss: pfv
  - text: буцив
    gloss: pret
  - text: бурцара
    gloss: ipfv
definitions:
  - translation:
      en: to hold
      ru: держать
    examples:
      - text: буца уццула тӏеле
      - text: ттутту буца
  - translation:
      en: to catch
      ru: ловить
    examples:
      - text: аттацци варх бялиҡҡе дурцаде
  - translation:
      en: hire
    examples:
      - text: устта урцанда бяъруме чидяҡяра
  - translation:
      en: to bear
      ru: переносить, выдерживать
    aliases:
      en: [tolerate, endure]
    examples:
      - text: буцӏаре буцара авирьул
        translation:
          en: can't bear cold weather
