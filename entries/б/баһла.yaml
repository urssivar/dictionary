headword: баһла
ipa: bahˈla
tags: [adj]
definitions:
  - translation:
      en: slow
      ru: медленный
    examples:
      - text: баһлал маваҳатте
  - translation:
      en: careful
      ru: размереный, аккуратный
    examples:
      - text: баһлал булчӏе
        translation:
          en: read carefully
      - text: цула баһла биһӕв
        translation:
          en: tooth eased
