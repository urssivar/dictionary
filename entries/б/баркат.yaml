headword: баркат
ipa: baɾˈkat
tags: [n, loan, arabic]
definitions:
  - translation:
      en: abundance; boon
      ru: изобилие; благо; благодать
    aliases:
      en: [grace, prosperity]
    examples:
      - text: Ил барив һулмат баркат биһав етти.
        translation:
          ru: Пусть оказанное тобой уважение будет тебе во благо
      - text: Барив хурег баркатла агур, ӕвра халкӏи чиһаҡив.
        translation:
          ru: Приготовленная еда получилась благодатной, множеству людей хватило.
