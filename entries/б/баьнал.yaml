headword: баьнал
ipa: bahˈnal
tags: [conj]

definitions:
  - translation:
      en: because
      ru: из-за
    aliases:
      en: [for, due, to]
    examples:
      - text: Ци баьнал?
        translation:
          en: Because of what?
          ru: Из-за чего?
      - text: Ду баьнал дила уртаҡҡ шаьарцци тта цағив.
        translation:
          en: My friend came from city for me.
          ru: Мой друг приехал из города из-за меня.

variants: [баьандан, баьнадин]
derived_from: [баьна]
