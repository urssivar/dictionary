headword: барҳ
ipa: ˈbaɾx
tags: [adj, vb, cls]
etymology:
  en: May be from *бирҳара* "to pacify".
definitions:
  - translation:
      en: fair
      ru: справедливый
    aliases:
      en: [right, "true"]
    examples:
      - text: варҳ мейдам це
        translation:
          ru: он справедливый человек
  - translation:
      en: right
      ru: верный
    aliases:
      en: [correct, "true"]
    examples:
      - text: һел барҳле це
        translation:
          en: that's right
