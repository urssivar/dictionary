headword: буцӏара
ipa: buˈtsʼaɾa
tags: [v, tr, ntr, cls]
forms:
  - text: берцӏара
    gloss: pfv
  - text: берцӏив
    gloss: pret
  - text: буцӏара
    gloss: ipfv
definitions:
  - translation:
      en: to bake
      ru: выпекать
    tags: [food]
    aliases:
      en: [fry]
    examples:
      - text: черинцци дерцӏив чӏаҡӏо
  - translation:
      en: жарить
    examples:
      - text: берта берцӏа
  - translation:
      en: to ripen
      ru: созревать
    aliases:
      en: [mature, mellow]
    examples:
      - text: тӏутӏи дуцӏул це
  - translation:
      en: to tan
      ru: загорать
    aliases:
      en: [burn]
    examples:
      - text: баригу верцӏив
