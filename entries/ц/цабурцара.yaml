headword: цабурцара
ipa: tsabuɾˈtsaɾa
tags: [v, tr, cls]
forms:
  - text: цабуцара
    gloss: pfv
  - text: цабуцив
    gloss: pret

definitions:
  - translation:
      en: to embrace
      ru: обхватывать
    aliases:
      en: [cover, armful]
  - translation:
      en: to solidify, to harden
      ru: затвердевать, застывать
    examples:
      - text: ццимин цабуцив
        translation:
          en: the cement has hardened
          ru: цемент затвердел
