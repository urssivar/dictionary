headword: цамбӕҡил
ipa: tsamˈbæqil
tags: [conj]
etymology:
  en: From *цан* "joint" + *бурҡяра* "hit".
definitions:
  - translation:
      en: also
      ru: также
    aliases:
      en: [too, together, at, the, same, time]
    examples:
      - text: цамбӕҡил чӏаҡо ра һаса
        translation:
          en: buy bread as well
