headword: ци
ipa: ˈtsi
tags: [pro]
forms:
  - text: ци
    gloss: abs
  - text: цил
    gloss: obl
definitions:
  - translation:
      en: what
      ru: что
    examples:
      - text: ци де йа ра һел?
        translation:
          en: what was even it?
      - text: и цилжи чиһул де йа?
        translation:
          en: what are you looking at?
      - text: ци әһле ҡил уживде йа?
        translation:
          en: how come you stayed home?
