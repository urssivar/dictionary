headword: зай
ipa: ˈzaj
tags: [adj]
note:
  en: '*зей*'
definitions:
  - translation:
      en: spoiled
      ru: испорченный, сломанный
    aliases:
      en: [broken, bad]
    examples:
      - text: урши зай виһӕв
        translation:
          en: the boy got spoiled
      - text: машин зай биһӕв
        translation:
          en: the car stopped working
