headword: зәнг
ipa: ˈzæng
tags: [n]

definitions:
  - translation:
      en: call, ring
      ru: звонок, телефонный вызов
    aliases:
      en: [ringing]
    examples:
      - text: Зәнг дара ила уцций.
        translation:
          en: Call your brother.
          ru: Позвони твоему брату.

variants: [зәнғ]
