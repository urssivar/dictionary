headword: һав
ipa: ˈhaβ
tags: [adv]
etymology:
  en: From *ьаби* "uphill".
note:
  en: '*ьаби*, *ьебе*'
definitions:
  - translation:
      en: towards
      ru: в направлении
    aliases:
      en: [direction, to]
    examples:
      - text: еркӏ һав тта цӕбун
        translation:
          en: they came from the direction of the river
