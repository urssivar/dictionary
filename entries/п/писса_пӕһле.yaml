headword: писса пӕһле
ipa: ˈpisːa ˌpæhle
tags: [adv]

definitions:
  - translation:
      en: without trace
      ru: бесследно
    examples:
      - text: писcа пӕһле берҡӏив
        translation:
          en: disappeared without a trace
          ru: исчезло без следа

variants: [писси пӕһле, пӕһле]
