headword: писса пәһле
ipa: ˈpisːa ˌpæhle
tags: [adv]

definitions:
  - translation:
      en: without trace
      ru: бесследно
    examples:
      - text: писcа пәһле берҡӏив
        translation:
          en: disappeared without a trace
          ru: исчезло без следа

variants: [писси пәһле, пәһле]
