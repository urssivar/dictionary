headword: дай
ipa: ˈdaj
tags: [adj]

definitions:
  - translation:
      en: unused, ownerless
      ru: неиспользуемый, бесхозный
    examples:
      - text: Һеж дай дуне и ваһле це.
        translation:
          en: This unused land is at your disposal.
          ru: Этот неиспользуемый край в твоём распоряжении.
