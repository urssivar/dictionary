headword: ҡӏал
ipa: ˈqʼal
tags: [intj]

definitions:
    translation:
      en: surely
      ru: ведь
    aliases:
      en: [of, course, indeed]
  - note:
      en: Expresses assurance.
    examples:
      - text: вярунда кӏал
        translation:
          en: surely i went
      - text: ьел ҡӏал
        translation:
          en: this is indeed

variants: [ал, ҡӏали]
