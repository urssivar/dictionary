headword: я бикӏора
ipa: ˌæ biˈkʼʷaɾa
tags: [v, ntr, cls]

definitions:
  - translation:
      en: to yell
      ru: орать
    aliases:
      en: [cry, shout]
    examples:
      - text: Цили я дикӏул да йе нишша?
        translation:
          en: Why are you yelling?
          ru: Почему вы орёте?
