headword: тӏутӏу бирара
ipa: tʼuˌtʼu biˈɾaɾa
tags: [v, tr, cls]
forms:
  - text: барара
    gloss: pfv
  - text: барив
    gloss: pret

definitions:
  - translation:
      en: to scatter
      ru: посыпать
    aliases:
      en: [sprinkle, strew, dredge]
  - translation:
      en: to banish
      ru: прогонять
    aliases:
      en: [expel]
  - translation:
      en: to waste
      ru: тратить напрасно
