headword: мәлӏум
ipa: mælˈʔum
tags: [n, loan, arabic]
forms:
  - text: мәлӏумте
    gloss: pl

definitions:
  - translation:
      en: serpent
      ru: змей
    tags: [animal]
    aliases:
      en: [snake]
    examples:
      - text: мәлӏуми шин диҡҡан
        translation:
          en: water strider (insect)
          ru: водомерка (насекомое)

variants: [мәлӏун]
