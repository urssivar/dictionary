headword: ҳҳал
ipa: ˈxːal
tags: [conj]

definitions:
  - translation:
      en: for, for the sake of
      ru: для, ради
    examples:
      - text: Ил һел ци ҳҳал баривде йе?
        translation:
          en: What did you do it for?
      - text: Ду дила уцци ҳҳал цәунда.
        translation:
          en: I came for the sake of my brother.
