tags: [n, loan, arabic]
forms:
  - text: нухсанте
    gloss: pl

definitions:
  - translation:
      en: flaw, defect
      ru: изъян, порок
    aliases:
      en: [shortcoming, drawback]
      ru: [недостаток]
    examples:
      - text: нухсанле варив
        translation:
