headword: чӏуйнәҡӏи
ipa: ˈtʃʼujnæqʼi
tags: [adv]

definitions:
  - translation:
      en: second time
      ru: на второй раз
    examples:
      - text: Чӏуйнәҡӏи цәун.
        translation:
          en: Came the second time.
          ru: Пришёл во второй раз.

variants: [чӏуйна һәҡӏи, чӏуйналжи, чӏуйнайбил]
