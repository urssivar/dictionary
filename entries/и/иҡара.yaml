headword: иҡара
ipa: iˈqaɾa
tags: [v, tr]
forms:
  - text: аҡара
    gloss: pfv
  - text: аҡив
    gloss: pret

definitions:
  - translation:
      en: to pass
      ru: проходить, преодолевать
    aliases:
      en: [surmount, overcome]
    examples:
      - text: ирчил еркӏ аҡив
        translation:
          en: the horse passed the river
