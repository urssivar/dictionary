headword: Аллаьичче
ipa: alˈlahitʃːe
tags: [post, vb]

definitions:
  - translation:
      en: for God's sake
      ru: ради Бога
    examples:
      - text: Аллаьичче ватаба ду!
        translation:
          en: For God's sake leave me alone!
          ru: Ради Бога, оставьте меня в покое!

variants: [Аллаь виччен]
derived_from: [Аллаь, биккара]
