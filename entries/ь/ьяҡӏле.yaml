headword: ьяҡӏле
ipa: ˈhæqʼle
tags: [adv]

definitions:
  - translation:
      en: exceptionally, unusually
      ru: исключительно, необычайно
    aliases:
      en: [very, especially, strongly]
      ru: [очень, особенно, сильно]
    examples:
      - text: ьяҡӏле ччакко рирси
        translation:
          en: unusually beautiful girl
          ru: необычайно красивая девушка
