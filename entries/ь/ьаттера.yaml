headword: ьаттера
ipa: haˈtːeɾa
tags: [adv]

definitions:
  - translation:
      en: more
      ru: более
    aliases:
      en: [better, greater]
      ru: [лучше, больше]
    examples:
      - text: Ьештти ьаттера бицците це.
        translation:
          en: These are even more tasty.
          ru: Эти ещё более вкусные.
