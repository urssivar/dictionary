headword: ғай
ipa: ˈʁaj
tags: [n]
forms:
  - text: ғайре
    gloss: pl

definitions:
  - translation:
      en: language
      ru: язык
    examples:
      - text: ниҳҳа ғай
        translation:
          en: родной язык
          ru: mother tongue
  - translation:
      en: speech, words
      ru: речь, слова
    examples:
      - text: ғай дейкку
        translation:
          en: no words
      - text: дацӏ ғай
        translation:
          en: verbiage
      - text: ғайла букӏа
        translation:
          en: chatterbox
      - text: әвра ғай дарив
        translation:
          en: talked too much

variants: [ғой]
