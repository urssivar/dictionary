headword: ғуней
ipa: ʁuˈnej
tags: [intj]

definitions:
  - translation:
      en: in short, so...
      ru: в общем, значит
    examples:
      - text: Цӏил икӏул угадал ғуней, һелттел һабағив.
        translation:
          en: Damn, you’re getting in the way too, you know.
          ru: Блин, вот ты тоже мешаешься ведь.
