headword: кабиркара
ipa: kabiɾˈkaɾa
tags: [v, ntr, cls]
forms:
  - text: кабикара
    gloss: pfv
  - text: кабичив
    gloss: pret

definitions:
  - translation:
      en: to fall
      ru: падать
  - translation:
      en: to elapse, to pass
      ru: проходить, истекать
    examples:
      - text: бацц кабикарай чин
        translation:
          en: before the end of the month
          ru: до окончания месяца

### аттай кичил виде
