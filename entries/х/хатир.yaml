headword: хатир
ipa: χaˈtiɾ
tags: [n, loan, arabic]
etymology:
  en: From Arabic *خَاطِر*.
definitions:
  - translation:
      en: respect
      ru: уважение
    aliases:
      en: [honor, authority]
    examples:
      - text: һелела хатир бугун
        translation:
          en: he lost his respect
      - text: хатир дарара
        translation:
          en: to show respect
