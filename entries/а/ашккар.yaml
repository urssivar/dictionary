headword: ашккар
ipa: aʃˈkːaɾ
tags: [adj, loan, iranian]

definitions:
  - translation:
      en: explicit, clear
      ru: явный, ясный
    examples:
      - text: Сар ил диӏунте һана ашккар диһәв.
        translation:
          en: What you stole earlier has now become clear.
          ru: То что ты украл раньше сейчас стало явным.

etymology:
  en: From Persian آشكار (*âškâr*) "obvious".
  ru: От персидского آشكار (*âškâr*) "очевидный".

variants: [ашкӏар]
