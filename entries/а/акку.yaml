headword: акку
ipa: ˈakːu
tags: [cop, vb]
forms:
  - text: аккоде
    gloss: "1"
  - text: аккотте
    gloss: "2.sg"
  - text: аккотта
    gloss: 2.pl
  - text: акку
    gloss: "3"
  - text: аччу
    gloss: pst

definitions:
  - translation:
      en: not
      ru: не
    examples:
      - text: Һел тухтур акку.
        translation:
          en: He's not a doctor.
          ru: Он не доктор.
      - text: Ил барһул аккотте у?
        translation:
          en: Don't you know?
          ru: Ты не знаешь?
      - text: Ду ҡил аччу сса.
        translation:
          en: I was not home yesterday.
          ru: Вчера я был не дома.

etymology:
  en: Habitual present of the historic verb *\*аккора*. The past tense's form developed from *аккви* → *аччви* → *аччу*.
  ru: Настоящее общее от исторического глагола *\*аккора*. Форма прошедшего времени развивалась как *аккви* → *аччви* → *аччу*.

variants: [аккура]
derived_from: ["*аккора"]
see_also: [аккор-2]
