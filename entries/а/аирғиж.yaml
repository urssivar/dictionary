headword: аирғиж
ipa: aiɾʁˈiʒ
tags: [adj, vb]

definitions:
  - translation:
      en: incomprehensible, unclear
      ru: непонятный, неясный
    aliases:
      en: [opaque, obscure]
      ru: [темный, смутный]
    examples:
      - text: Дами аирғиж ғай.
        translation:
          en: A language incomprehensible to me.
          ru: Непонятный для меня язык.

etymology:
  en: Negative hypothetical participle of *ирғара* "to understand".
  ru: Отрицательное гипотетическое причастие от *ирғара* "понимать".

derived_from: [ирғара]
