headword: алтӏана
ipa: alˈtʼana
tags: [v, tr, ntr]
forms:
  - text: атӏана
    gloss: pfv
  - text: атӏун
    gloss: pret

definitions:
  - translation:
      en: to stick
      ru: втыкаться
    aliases:
      en: [prick, pierce]
      ru: [уколоть, проткнуть]
    examples:
      - text: Тӏуппуцци чаххул атӏун.
        translation:
          en: A thorn stuck into finger.
          ru: Колючка воткнулась в палец.
