headword: алав цикара
ipa: aˌlaβ tsiˈkaɾa
tags: [v, tr]
forms:
  - text: цакара
    gloss: pfv
  - text: цачив
    gloss: pret

definitions:
  - translation:
      en: to navigate
      ru: подводить
    aliases:
      en: [steer, influence]
      ru: [направлять, влиять]
    examples:
      - text: Ихтилат циней баживцци алав цачив.
        translation:
          en: Navigated the conversation to where he needed.
          ru: Подвёл разговор куда ему надо было.

derived_from: [алав, бикара]
