headword: алав цикара
ipa: aˌlaβ tsiˈkaɾa
tags: [v, tr]
forms:
  - text: цакара
    gloss: pfv
  - text: цачив
    gloss: pret

definitions:
  - translation:
      en: to navigate, to steer
      ru: подводить, направлять
    aliases:
      en: [influence]
      ru: [влиять]
    examples:
      - text: Ихтилат циней баживцци алав цачив.
        translation:
          en: Navigated the conversation to where he needed.
          ru: Подвёл беседу куда ему надо было.

derived_from: [алав, бикара]
