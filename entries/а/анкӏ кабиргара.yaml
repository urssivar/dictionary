headword: анкӏ кабиргара
ipa: ˌankʼ kabiɾˈgaɾa
tags: [v, ntr, cls]
forms:
  - text: кабигара
    gloss: pfv
  - text: кабижив
    gloss: pret

definitions:
  - translation:
      en: to doze
      ru: кимарить
    aliases:
      en: [to sleep, to nap]
      ru: [спать, дремать]

etymology:
  en: The first element shares a root with *анкьала* "sleep".
  ru: Первый элемент имеет общий корень с *анкьала* "сон".

variants: [чибуссана]
derived_from: ["*анкӏ", кабиргара]
see_also: [анкӏала]
