headword: ахтукӏал
ipa: aχˈtukʼal
tags: [n, pl]
forms:
  - text: ахтукӏлан
    gloss: obl
  - text: ахтукӏле
    gloss: pl

definitions:
  - translation:
      en: phlegm
      ru: мокрота
    tags: [body]
    aliases:
      en: [sputum]
      ru: [слизь]
    examples:
      - text: Ахтукӏле ах дарил ту дара.
        translation:
          en: Spit out the phlegm.
          ru: Выплюнь мокроту.

etymology:
  en: usually plural
  ru: обычно мн. ч.

variants: [тутукӏле]
derived_from: ["*ах", ту]
