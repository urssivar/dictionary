headword: ахтукӏал
ipa: aχˈtukʼal
tags: [n, pl]
forms:
  - text: ахтукӏлан
    gloss: obl
  - text: ахтукӏле
    gloss: pl

definitions:
  - translation:
      en: sputum, phlegm
      ru: мокрота, слизь
    tags: [body]
    note:
      en: usually plural
      ru: обычно во мн. ч.
    examples:
      - text: Ахтукӏле ах дарил ту дара.
        translation:
          en: Cough up and spit out the phlegm.
          ru: Откархни и выплюнь мокроту.

variants: [тутукӏле]
derived_from: ["*ах", ту]
