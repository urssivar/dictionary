headword: ахтукӏал
ipa: aχˈtukʼal
tags: [n, pl]
forms:
  - text: ахтукӏлан
    gloss: obl
  - text: ахтукӏле
    gloss: pl

definitions:
  - translation:
      en: sputum, phlegm
      ru: мокрота, слизь
    tags: [body]
    examples:
      - text: Ахтукӏле ах дарил ту дара.
        translation:
          en: Cough up and spit out the phlegm.
          ru: Откархни и выплюнь мокроту.

etymology:
  en: usually plural
  ru: обычно мн. ч.

variants: [тутукӏле]
derived_from: ["*ах", ту]
