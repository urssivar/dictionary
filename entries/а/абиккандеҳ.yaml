headword: абиккандеҳ
ipa: abikːanˈdex
tags: [n, vb]
forms:
  - text: абиккандеҳҳе
    gloss: pl

definitions:
  - translation:
      en: nuisance, disappointment
      ru: неприятность, разачарование
    tags: [feeling]
    aliases:
      en: [trouble, distress]
      ru: [беда, страдание]
    examples:
      - text: Рирсила абиккандеҳ чи бичив кулпети.
        translation:
          en: The family faced trouble with their daughter.
          ru: Семья столкнулась с неприятностью из-за дочери.

derived_from: [абиккан]
