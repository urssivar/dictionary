headword: абиккандеҳ
ipa: abikːanˈdex
tags: [n, vb]

definitions:
  - translation:
      en: nuisance, disappointment
      ru: неприятность, разачарование
    tags: [feeling]
    aliases:
      en: [trouble, distress]
      ru: [беда, страдание]
    examples:
      - text: Рирсила абиккандеҳ чи бичив кулпети.
        translation:
          en: 
          ru: На семью выпала неприятность, связанная с дочкой.

derived_from: [абиккан]
