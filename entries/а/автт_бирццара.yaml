headword: автт бирццара
ipa: ˌaβtː biɾˈtsːaɾa
tags: [v, ntr, cls]
forms:
  - text: биццара
    gloss: pfv
  - text: биццур
    gloss: pret

definitions:
  - translation:
      en: to catch up, to align
      ru: равняться
    examples:
      - text: Автт биццул дуцӏ бижив.
        translation:
          en: They catched up and run.
          ru: Сравнялись и побежали.

derived_from: [автт, "*бирццара"]
