headword: ахтирекк
ipa: aχtiˈɾekː
tags: [n, loan, turkic]

definitions:
  - translation:
      en: poplar
      ru: тополь
    tags: [tree]

etymology:
  en: From Kumyk *акътерек* "aspen".
  ru: От кумыкского *акътерек* "осина".
note:
  en: Also *шан ахтирекк*, *цӏяв ахтирекк* for specific poplar species.
  ru: Также *шан ахтирекк*, *цӏяв ахтирекк* для конкретных видов тополя.
