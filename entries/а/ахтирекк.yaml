headword: ахтирекк
ipa: aχtiˈɾekː
tags: [n, loan, turkic]
forms:
  - text: ахтирекке
    gloss: pl

definitions:
  - translation:
      en: poplar
      ru: тополь
    tags: [tree]
    examples:
      - text: цӏәв ахтирекк
        translation:
          en: silver poplar (white poplar)
          ru: тополь белый (тополь серебристый)
      - text: шан ахтирекк
        translation:
          en: black poplar (cottonwood)
          ru: тополь чёрный (осокорь)

etymology:
  en: From Kumyk *акътерек* "aspen".
  ru: От кумыкского *акътерек* "осина".
