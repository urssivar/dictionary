headword: акбер
ipa: ˈakbeɾ #?
tags: [n, loan, arabic]
forms:
  - text: акбер
    gloss: abs
  - text: акберте
    gloss: pl

definitions:
  - translation:
      en: adhan
      ru: азан
    aliases:
      en: [call]
      ru: [призыв]
    examples:
      - text: акбер катӏив
        translation:
          en: read adhah
          ru: прочли азан

etymology:
  en: From Arabic أَكْبَر (*ʔakbar*) "greatest".
  ru: От арабского أَكْبَر (*ʔakbar*) "величайший".

variants: [акбар]
