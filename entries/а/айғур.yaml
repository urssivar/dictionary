headword: айғур
ipa: ajˈʁuɾ
tags: [n, loan, turkic]
forms:
  - text: айғурте
    gloss: pl

definitions:
  - translation:
      en: stallion
      ru: жеребец
    tags: [animal]
    aliases:
      en: [stud, steed, horse]
      ru: [конь, скакун, лошадь]
    examples:
      - text: Айғури мәртта вижил вегур.
        translation:
          en: Mounted a stallion and rode away.
          ru: Оседлал жеребца и ускакал.

etymology:
  en: From Kumyk *айгъыр* "stallion".
  ru: От кумыкского *айгъыр* "жеребец".

variants: [айғур-йәбу]
