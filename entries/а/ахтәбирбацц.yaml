headword: ахтәбирбацц
ipa: aχtæˈbiɾbatsː
tags: [n, loan, russian]
forms:
  - text: ахтәбирбацце
    gloss: obl
  - text: ахтәбирбиццре
    gloss: pl

definitions:
  - translation:
      en: October
      ru: октябрь
    tags: [time]
    aliases:
      en: [month]
      ru: [месяц]
    examples:
      - text: Идус ахтәбирбацц гунал цабағив.
        translation:
          en: This year October came warm.
          ru: В этом году октябрь настал тёплым.

etymology:
  en: From Russian *октябрь* "October".
  ru: От русского *октябрь*.

derived_from: [бацц]
variants: [ухтәбир]
