headword: аттих
ipa: aˈtːiχ
tags: [n, loan, russian]
forms:
  - text: аттиххе
    gloss: pl

definitions:
  - translation:
      en: pause, break
      ru: пауза, перерыв
    aliases:
      en: [rest]
      ru: [отдых]
    examples:
      - text: Вә, аттих бара.
        translation:
          en: Go, have a break.
          ru: Иди, сделай паузу.

etymology:
  en: From Russian *отдых* "rest".
  ru: От русского *отдых*.
