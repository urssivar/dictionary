headword: ашна
ipa: aʃˈna
tags: [intj, loan, iranian]

definitions:
  - translation:
      en: presentative particle (here, that's it, this is why)
      ru: указательная частица (вот, вот так)
    examples:
      - text: Һел ҡҡелла ашна.
        translation:
          en: And that's why.
          ru: Вот из-за этого.
