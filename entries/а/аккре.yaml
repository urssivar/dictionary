headword: аккре
ipa: ˈakːɾe
tags: [n, vb]
forms:
  - text: аккунде
    gloss: pl

definitions:
  - translation:
      en: nonsense, non-existent
      ru: чушь, несуществующий
    aliases:
      en: [fiction, lies, falsehood]
      ru: [неправда, ложь]
    examples:
      - text: Аккунде мадурса!
        translation:
          en: Don't talk nonsense!
          ru: Не неси чушь!

derived_from: ["*аккора"]
variants: [аккор цикӏал, аккорил]
