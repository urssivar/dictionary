headword: алавлера
ipa: aˈlaβleɾa
tags: [intj]

definitions:
  - translation:
      en: no way, under no circumstances
      ru: ни за что, ни в коем случае
    examples:
      - text: Ца алавлера мацәв!
        translation:
          en: No way, he may not come!
          ru: Ни за что, пусть не приходит!

derived_from: [алав, ра]
