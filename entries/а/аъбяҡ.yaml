headword: аъбяҡ
ipa: аʔbæq
tags: [n]
forms:
  - text: аъбяҡе
    gloss: pl

definitions:
  - translation:
      en: bungler, inept
      ru: растяпа, неумеха
    tags: [slur]
    examples:
      - text: Аъбяҡли дяъ ттуғ дарил велле бицӏал мярцца дуҡҡив.
        translation:
          en: While the bungler was staring, the wolves carried off the sheep.
          ru: Пока растяпа таращился волки унесли овец.

derived_from: [аъ]
