headword: анццуҡҡ
ipa: anˈtsːuqː
tags: [n]
forms:
  - text: анццуҡҡе
    gloss: pl

definitions:
  - translation:
      en: reproach (over past failures)
      ru: упрёк (напоминание о прошлых неудачах)
    aliases:
      en: [mockery, tease]
      ru: [издёвка, насмешка]
    examples:
      - text: Цинна уршила чевтта анццуҡҡ бирххур һелей.
        translation:
          en: Reproached him about his son.
          ru: Упрекнул его насчёт его сына.
