headword: анццуҡҡ
ipa: anˈtsːuqː
tags: [n]
forms:
  - text: анццуҡҡе
    gloss: pl

definitions:
  - translation:
      en: reproach
      ru: упрёк
    aliases:
      en: [mockery, tease]
      ru: [издёвка, насмешка]
    note:
      en: a reminder of past failures
      ru: напоминание о прошлых неудачах
    examples:
      - text: Цинна уршила чевтта анццуҡҡ бирххур һелей.
        translation:
          en: Reproached him about his son.
          ru: Упрекнул его насчёт его сына.
