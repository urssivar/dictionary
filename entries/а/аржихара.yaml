headword: аржихара
ipa: aɾʒiˈχaɾa
tags: [v, tr]
forms:
  - text: ажихара
    gloss: pfv
  - text: ажихур
    gloss: pret

definitions:
  - translation:
      en: to cause
      ru: причинять
    aliases:
      en: [to bring about, to inflict]
      ru: [вызывать, наносить]
    examples:
      - text: Ил һелей вәһидеҳ ажихурде.
        translation:
          en: You caused him harm.
          ru: Ты причинил ему вред.

derived_from: [аргара]
