headword: арже
ipa: ˈaɾʒe
tags: [n]
forms:
  - text: аржин
    gloss: obl
  - text: аржиппе
    gloss: pl

definitions:
  - translation:
      en: shaft
      ru: рукоять
    tags: [tool]
    aliases:
      en: [handle, knob, helve]
      ru: [ручка, держатель]
    examples:
      - text: Арже буцил беретта берһив.
        translation:
          en: He grabbed the handle and struck with the axe.
          ru: Схватил за рукоять и ударил топором.
  - translation:
      en: long tail
      ru: длинный хвост
    tags: [tool]
    examples:
      - text: йәбула арже
        translation:
          en: horse tail
          ru: лошадиный хвост

#? стебель цветка, пшеницы
