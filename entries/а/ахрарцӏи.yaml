headword: ахрарцӏи
ipa: aχɾaɾˈtsʼi
tags: [n]

definitions:
  - translation:
      en: first furrow festival
      ru: праздник первой борозды
    tags: [culture]
    aliases:
      en: [festival]
      ru: [праздник]

etymology:
  en: May be related to *аҡ* "vineyard" and *ирцӏара* "to weed".
  ru: Может быть связано с *аҡ* "виноградник" и *ирцӏара* "полоть".

see_also: [аҡ, ирцӏара]
