headword: аҡҡе
ipa: ˈaqːe
tags: [n]
forms:
  - text: аҡҡин
    gloss: obl
  - text: аҡҡне
    gloss: pl

definitions:
  - translation:
      en: hearth
      ru: очаг
    tags: [structure]
    aliases:
      en: [fireplace, fire]
      ru: [огонь, костёр]
    examples:
      - text: Аҡҡинцци цӏа һабиҡӏун це.
        translation:
          en: A fire is lit in the hearth.
          ru: Огонь разожжён в очаге.

variants: [әҡҡи]
see_also: [цӏиппа]
