headword: аҳлиӏән
ipa: axliˈʔæn
tags: [n]
forms:
  - text: аҳлиӏне
    gloss: pl

definitions:
  - translation:
      en: bird
      ru: птица
    tags: [bird]
    examples:
      - text: Әрҡӏо ра ҡҡвәна ра аҳлиӏне це.
        translation:
          en: И курица, и ворона — птицы.
          ru: Both the chicken and the crow are birds.

derived_from: ["*аҳора"]
variants: [аҳлиҡӏә]
see_also: [һиҳора]
