headword: аххал
ipa: aˈχːal
tags: [n]
forms:
  - text: ахле
    gloss: pl

definitions:
  - translation:
      en: guest
      ru: гость
    aliases:
      en: [visitor]
      ru: [посетитель, кунак]
  - translation:
      en: kunak
      ru: кунак
    examples:
      - text: Һет шшилцци ниссала әһ ахле би.
        translation:
          en: We have good kunaks in that village.
          ru: В том селе у нас есть хорошие кунаки.
