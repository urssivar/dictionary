headword: аххал
ipa: aˈχːal
tags: [n]
forms:
  - text: ахле
    gloss: pl

definitions:
  - translation:
      en: person, fellow
      ru: человек
    note:
      en: Also a form of address, known or not. An adult but not elderly, by default a middle-aged man; narrowed by a following word, e.g. *урши* "guy".
      ru: Также обращение, к знакомому или нет. Взрослый, но не пожилой, по умолчанию мужчина средних лет; уточняется следующим словом, напр. *урши* "парень".
    examples:
      - text: Һет аххалли беччив.
        translation:
          en: That man gave it.
          ru: Тот дядёнька дал.
      - text: Һей, аххал рирси!
        translation:
          en: Hey, young lady!
          ru: Эй, девушка!
  - translation:
      en: guest
      ru: гость
    aliases:
      en: [visitor]
      ru: [посетитель]
    examples:
      - text: Ахле чӏулцци цабиғанте це.
        translation:
          en: Guests are expected to arrive at two.
          ru: Гости должны прибыть в два.
  - translation:
      en: kunak (sworn guest-friend)
      ru: кунак
    examples:
      - text: Һет шшилцци ниссала әһ ахле би.
        translation:
          en: We have good kunaks in that village.
          ru: В том селе у нас есть хорошие кунаки.
