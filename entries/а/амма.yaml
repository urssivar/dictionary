headword: амма
ipa: ˈamma
tags: [conj, loan, arabic]

definitions:
  - translation:
      en: but
      ru: но
    aliases:
      en: [though, and]
      ru: [хотя, а]
    examples:
      - text: Чи важивда, амма ғай куҡана аагур.
        translation:
          en: Saw him, but couldn't discuss.
          ru: Увидел его, но обсудить не получилось.
      - text: Амма и ра әһ мейдам аккотте.
        translation:
          en: But you are not a good person either.
          ru: Но и ты не хороший человек.

etymology:
  en: From Arabic أَمَّا (*ʔammā*) "as for".
  ru: От арабского أَمَّا (*ʔammā*) "что касается".
