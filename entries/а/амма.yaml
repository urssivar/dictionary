headword: амма
ipa: ˈamma
tags: [conj, loan, arabic]

definitions:
  - translation:
      en: but
      ru: но
    aliases:
      en: [though, and]
      ru: [хотя, а]
    examples:
      - text: Чи важивда, амма ғай куҡана аагур.
        translation:
          
      - text: Амма и әһ мейдам аккоде.
        translation:

etymology:
  en: From Arabic أَمَّا (*ʔammā*) "as for".
  ru: От арабского أَمَّا (*ʔammā*) "что касается".
