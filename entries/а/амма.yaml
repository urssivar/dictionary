headword: амма
ipa: ˈamma
tags: [conj, loan, arabic]

definitions:
  - translation:
      en: but
      ru: но
    aliases:
      en: [though, and]
      ru: [хотя, а]
    examples:
      - text: И һелин вәрунде, амма ҡкуллуҡҡ таман абаривде.
        translation:
          en: You went there, but you didn't finish the job.
          ru: Ты пошёл туда, но не завершил дело.
etymology:
  en: From Arabic أَمَّا (*ʔammā*) "as for".
  ru: От арабского أَمَّا (*ʔammā*) "что касается".
