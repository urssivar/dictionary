headword: аӏ кабурҡара
ipa: ˌaʔ kabuɾˈqaɾa
tags: [v, ntr]
forms:
  - text: кабәҡара
    gloss: pfv
  - text: кабәҡив
    gloss: pret

definitions:
  - translation:
      en: to gawp, to stare
      ru: таращиться, глядеть
    aliases:
      en: [watch, see]
      ru: [смотреть]
    examples:
      - text: Урши аӏ кәҡил велле, бицӏал мәрцца дуҡҡив.
        translation:
          en: While the boy was gawping, the wolves carried off the sheep.
          ru: Пока мальчик таращился, волки унесли овец.

derived_from: [аӏ, бурҡара]
