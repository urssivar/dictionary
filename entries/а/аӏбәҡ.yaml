headword: аӏбәҡ
ipa: аʔbæq
tags: [n]
forms:
  - text: аӏбәҡе
    gloss: pl

definitions:
  - translation:
      en: bungler, inept
      ru: растяпа, неумеха
    examples:
      - text: Аӏбәҡли дәӏ ттуғ дарил велле бицӏал мәрцца дуҡҡив.
        translation:
          en: While the bungler was staring, the wolves carried off the sheep.
          ru: Пока растяпа таращился волки унесли овец.

derived_from: [аӏ]
