headword: абирһора
ipa: abiɾˈhʷaɾa
tags: [v, cls, ntr]

definitions:
  - translation:
      en: to be ailing, to be ill
      ru: хворать, болеть
    tags: [disease]
    aliases:
      en: [to be sick]
      ru: [недомогать]
    examples:
      - text: Ислен тин арирһул це.
        translation:
          en: She's been ailing for a while.
          ru: Она уже давно хворает.

etymology:
  en: Negative of *бирьора* "to be able".
  ru: Отрицательная форма от *бирьора* "мочь".

derived_from: [бирһора]
