headword: алав цабиргара
ipa: aˌlaβ tsabiɾˈgaɾa
tags: [v, ntr, cls]
forms:
  - text: цабигара
    gloss: pfv
  - text: цабижив
    gloss: pret

definitions:
  - translation:
      en: to gather
      ru: собираться
    aliases:
      en: [meet, congregate]
      ru: [собраться, встретиться, сходиться]
    examples:
      - text: Ьари, ьежин алав цадигай.
        translation:
          en: Hey, gather here.
          ru: А ну, соберитесь здесь.

derived_from: [алав, биргара]
