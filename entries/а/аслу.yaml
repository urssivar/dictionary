headword: аслу
ipa: ˈaslu
tags: [conj, loan, arabic]
forms:
  - text: аслун
    gloss: obl
  - text: аслуме
    gloss: pl

definitions:
  - translation:
      en: origin, genesis
      ru: источник, происхождение
    aliases:
      en: [base, source]
