headword: антаҡҡ
ipa: anˈtaqː
tags: [n]
forms:
  - text: антаҡҡе
    gloss: pl

definitions:
  - translation:
      en: forgetful, absent-minded person
      ru: забывчивый, рассеянный человек
    examples:
      - text: антаҡҡ виһора
        translation:
          en: to become forgetful
          ru: стать забывчивым

variants: [антуҡӏ]
