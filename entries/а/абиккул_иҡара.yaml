headword: абиккул иҡара
ipa: ˌabikːul iˈqaɾa
tags: [v, ntr]
forms:
  - text: аҡара
    gloss: pfv
  - text: аҡив
    gloss: pret

definitions:
  - translation:
      en: to take offense, to feel insulted
      ru: оскорбляться, обижаться
    tags: [feeling]
    aliases:
      en: [to be offended, to get upset]
      ru: [расстраиваться]
    examples:
      - text: Ду ацәун ҡҡелла циней абиккул аҡив #?
        translation:
          en: He took offense because I didn't come.
          ru: Он обиделся из-за того, что я не пришёл.

etymology:
  en: Negative converb of *биккара* "to want".
  ru: Отрицательное деепричастие от *биккара* "хотеть".

derived_from: [биккара, иҡара]
