headword: абиккул иҡара
ipa: ˌabikːul iˈqaɾa
tags: [v, ntr]
forms:
  - text: аҡара
    gloss: pfv
  - text: аҡив
    gloss: pret

definitions:
  - translation:
      en: to take offense
      ru: оскорбляться
    tags: [feeling]
    aliases:
      en: [to be offended, to feel insulted, to get upset]
      ru: [обидеться, расстроиться]
    examples:
      - text: Ду ацӕун ҡҡелла аттай абиккул аҡив
        translation:
          en: Father took offense because I didn't come.
          ru: Отец оскорбился из-за того, что я не пришёл.

derived_from: [биккара, иҡара]
