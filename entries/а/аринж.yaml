headword: аринж
ipa: aˈɾinʒ
tags: [n]

definitions:
  - translation:
      en: epidemic
      ru: эпидемия
    tags: [disease]
    aliases:
      en: [outbreak, plague]
      ru: [вспышка, мор]
    examples:
      - text: Аринжли баҡил укка бевчӏихив.
        translation:
          en: The epidemic killed many people.
          ru: Эпидемия погубила многих людей.
