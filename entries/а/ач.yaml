headword: ач
ipa: ˈatʃ
tags: [adj, loan, turkic]

definitions:
  - translation:
      en: open
      ru: открытый
    examples:
      - text: Уцца ач дара!
        translation:
          en: Open the door!
          ru: Открой дверь!
      - text: Жуже ач биһәв.
        translation:
          en: The flower blooms.
          ru: Цветок распустился.

etymology:
  en: From Kumyk *ачмакъ* "to open".
  ru: От кумыкского *ачмакъ* "открывать".

variants: [әч]
