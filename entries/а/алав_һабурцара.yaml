headword: алав һабурцара
ipa: aˌlaβ habuɾˈtsaɾa
tags: [v, cls, tr]
forms:
  - text: һабуцара
    gloss: pfv
  - text: һабуцив
    gloss: pret

definitions:
  - translation:
      en: to surround
      ru: окружать
    aliases:
      en: [encircle]
      ru: [обводить]
    examples:
      - text: Уба цинна дәһнал алав һаруцил разил риххул це.
        translation:
          en: Children surround their mother and keep her happy.
          ru: Дети окружают свою мать и хранят её счастливой.

derived_from: [алав, бурцара]
