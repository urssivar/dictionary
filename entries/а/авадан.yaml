headword: авадан
ipa: aβaˈdan
tags: [adj, loan, iranian]

definitions:
  - translation:
      en: spacious, extensive
      ru: просторный, обширный
    examples:
      - text: авадан дуне
        translation:
          en: expanse
          ru: раздолье
      - text: авадан чархла ваһ
        translation:
          en: big man (about body)
          ru: крупный человек (о теле)
  - translation:
      en: luxurious, rich
      ru: роскошный, богатый
    aliases:
      en: [wealthy]
      ru: [состоятельный]
    examples:
      - text: Убала уцци авадан виһәв.
        translation:
          en: Uncle got rich.
          ru: Дядя разбогател.

etymology:
  en: From Persian آبادان (*ābādān*) "thriving, prosperous".
  ru: От персидского آبادان (*ābādān*) "процветающий".
