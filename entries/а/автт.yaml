headword: автт
ipa: ˈaβtː
tags: [adj]

definitions:
  - translation:
      en: parallel
      ru: параллельный
    aliases:
      en: [simultaneous, concurrent]
      ru: [одновременный]
    examples:
      - text: Авттле кадиццай.
        translation:
          en: Line up.
          ru: Встаньте по линии.
