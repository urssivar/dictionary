headword: акупӏ
ipa: aˈkupʼ
tags: [n, loan, russian]
forms:
  - text: акупӏе
    gloss: pl

definitions:
  - translation:
      en: trench
      ru: траншея
    tags: [structure]
    aliases:
      en: [entrenchment, foxhole]
      ru: [окоп]
    examples:
      - text: акупӏ һабирҡҡора #?
        translation: #? акупӏи кичив ?
          en: to dig a trench
          ru: выкопать окоп

etymology:
  en: From Russian *окоп* "trench".
  ru: От русского *окоп*.

variants: [акуп]
