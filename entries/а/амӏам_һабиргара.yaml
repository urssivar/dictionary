headword: амӏам һабиргара
ipa: amˌʔam habiɾˈgaɾa
tags: [v, ntr, cls]
forms:
  - text: һабигара
    gloss: pfv
  - text: һабижив
    gloss: pret
  - text: бикӏора
    gloss: hab

definitions:
  - translation:
      en: to stutter
      ru: заикаться
    tags: [disease]
    aliases:
      en: [stammer]
    examples:
      - text: Амӏам икӏон це һеж мейдам.
        translation:
          en: This man stutters.
          ru: Этот человек заикается.

derived_from: ["*амӏам", биргара]
