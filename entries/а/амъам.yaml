headword: амъам
ipa: amˈʔam
tags: [n]

definitions:
  - translation:
      en: stutter
      ru: заикание
    aliases:
      en: [stammer]
      ru: [заикаться]
    examples:
      - text: амъам ьижив
        translation:
          en: he stuttered
          ru: он заикнулся

etymology:
  en: Probably onomatopoeia.
  ru: Вероятно, звукоподражание.
