headword: аккол
ipa: ˈakːʷal
tags: [conj, vb]

definitions:
  - translation:
      en: otherwise
      ru: иначе
    aliases:
      en: [or, else]
      ru: [или]
    examples:
      - text: Һежин аккол, һелин аргар у?
        translation:
          en: If it doesn't work here, will it there?
          ru: Если не здесь, там получится?

derived_from: [аккор]
