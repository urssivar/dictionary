headword: арц
ipa: ˈaɾts
tags: [n]
forms:
  - text: арцре
    gloss: pl

definitions:
  - translation:
      en: money
      ru: деньги
    aliases:
      en: [currency, cash]
      ru: [валюта, наличные]
    examples:
      - text: Тукенчий чӏаҡӏонла арц деччивда.
        translation:
          en: I paid the seller for the bread.
          ru: Я оплатил продавцу за хлеб.
      - text: Арцла ҡӏимат бейкку.
        translation:
          en: Money has no cost. (about inflation)
          ru: У денег нет стоимости. (про инфляцию)
  - translation:
      en: silver
      ru: серебро
    tags: [material]
    examples:
      - text: арцла белесса
        translation:
          en: silver bracelet
          ru: серебряный браслет
