headword: арц
ipa: ˈaɾts
tags: [n]
forms:
  - text: арцре
    gloss: pl

definitions:
  - translation:
      en: money
      ru: деньги
    aliases:
      en: [currency, cash]
      ru: [валюта, наличные]
    examples:
      - text: Арцла ҡӏимат абел.
        translation:
          en: Money no longer has cost.
          ru: У денег больше нет стоимости.
      - text: Тукенчий чӏаҡӏонла арц деччивда.
        translation:
          en: Paid the seller for the bread.
          ru: Оплатил продавцу за хлеб.
  - translation:
      en: silver
      ru: серебро
    tags: [material]
    examples:
      - text: арцла белесса
        translation:
          en: silver bracelet
          ru: серебряный браслет
