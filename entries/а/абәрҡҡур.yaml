headword: абәрҡҡур
ipa: abæɾˈqːuɾ
tags: [adj, cls, vb]
forms:
  - text: абәрҡҡул
    gloss: adv

definitions:
  - translation:
      en: uncultured
      ru: невоспитанный
    aliases:
      en: [boorish, rude]
      ru: [бескультурный, грубый]

etymology:
  en: Negative preterite of *руҡҡәра* "to educate, to bring up".
  ru: Отрицательный претерит от *руҡҡәра* "воспитывать".

derived_from: [руҡҡәра]
