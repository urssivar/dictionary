headword: аһлу
ipa: ˈahlu
tags: [n, loan, arabic]
forms:
  - text: аһлун
    gloss: obl
  - text: аһлуме
    gloss: pl

definitions:
  - translation:
      en: community, cohort
      ru: сообщество, когорта
    aliases:
      en: [people, group, generation]
      ru: [люди, группа, поколение]
    examples:
      - text: Алжаналла аһлу агав.
        translation:
          en: May she belong to the people of paradise.
          ru: Пусть она будет из обитателей рая.

etymology:
  en: From Arabic أَهْل (*ʔahl*) "family; people".
  ru: От арабского أَهْل (*ʔahl*) "семья; люди".
