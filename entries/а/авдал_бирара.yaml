headword: авдал бирара
ipa: aβˌdal biˈɾaɾa
tags: [v, cls, tr]
forms:
  - text: барара
    gloss: pfv
  - text: барив
    gloss: pret

definitions:
  - translation:
      en: to bewilder
      ru: сбивать с толку
    aliases:
      en: [to baffle, to perplex]
      ru: [смущать, озадачивать]
    examples:
      - text: Нишшала пишнал ду авдал варивда.
        translation:
          en: Your actions fooled me.
          ru: Ваши действия сбили меня с толку.

derived_from: [авдал, бирара]
