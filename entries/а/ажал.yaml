headword: ажал
ipa: aˈʒal
tags: [n, loan, arabic]

definitions:
  - translation:
      en: doom
      ru: рок
    tags: [religion]
    aliases:
      en: [death, fate, demise]
      ru: [смерть, судьба, кончина]
    examples:
      - text: И ажалли вӕҡ!
        translation:
          en: May you die!
          ru: Чтоб ты сдох!

etymology:
  en: From Arabic أَجَل (*ʔajal*) "appointed time, death".
  ru: От арабского أَجَل (*ʔajal*) "назначенный срок, смерть".
