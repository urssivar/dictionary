headword: ажал
ipa: aˈʒal
tags: [n, loan, arabic]

definitions:
  - translation:
      en: doom, demise
      ru: рок, кончина
    tags: [religion]
    aliases:
      en: [death, fate]
      ru: [смерть, судьба]
    examples:
      - text: И ажалли вәҡ!
        translation:
          en: May you die!
          ru: Чтоб ты сдох!
      - text: ажалла иццала
        translation:
          en: fatal disease
          ru: роковая болезнь

etymology:
  en: From Arabic أَجَل (*ʔajal*) "appointed time, death".
  ru: От арабского أَجَل (*ʔajal*) "назначенный срок, смерть".
