headword: ашрапи
ipa: aʃɾaˈpi
tags: [n, loan, arabic]
forms:
  - text: ашрапне
    gloss: pl

definitions:
  - translation:
      en: silver coin
      ru: серебрянная монета
    tags: [culture]
    examples:
      - text: Ашрапне ккурттени кивҡун.
        translation:
          en: They hung silver coins on the dress.
          ru: Повесили серебряные монеты на платье.
            
etymology:
  en: From Arabic أَشْرَفِيّ (*ʔašrafiyy*) "ashrafi" (historical gold coin).
  ru: От арабского أَشْرَفِيّ (*ʔašrafiyy*) "ашрафи" (историческая золотая монета).
