headword: аманат
ipa: amaˈnat
tags: [n, loan, arabic]

definitions:
  - translation:
      en: custody
      ru: попечение
    tags: [culture]
    aliases:
      en: [guardianship, care]
      ru: [опека, попечительство]
    examples:
      - text: Шамилли цинна урши аманат варил Әруссай веччив.
        translation:
          en: Shamil gave his son as collateral to the Russians.
          ru: Шамиль отдал своего сына в залог русским.

etymology:
  en: From Arabic أَمَانَة (*ʔamāna*) "trust, reliability".
  ru: От арабского أَمَانَة (*ʔamāna*) "верность, надёжность".
