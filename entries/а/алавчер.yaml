headword: алавчер
ipa: alaβˈtʃeɾ
tags: [post]

definitions:
  - translation:
      en: all around
      ru: кругом
    aliases:
      en: [about, round]
      ru: [вокруг]
    examples:
      - text: Барккара вирһул аккоде, ил ра алавчер ул бета.
        translation:
          en: I can't find it, look all around too.
          ru: Я не могу найти, ты тоже посмотри кругом.

derived_from: [алав]

#? ҡалла алавчер /> adv
#? по всему миру, дунела алавчер 
#? дунела шшиме ди
