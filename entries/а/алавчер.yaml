headword: алавчер
ipa: alaβˈtʃeɾ
tags: [post]

definitions:
  - translation:
      en: all around
      ru: кругом
    aliases:
      en: [about, round]
      ru: [вокруг]
    examples:
      - text: Барккара вирһул аккоде, алавчер ул бета.
        translation:
          en: I cannot find it, look all around.
          ru: Я не могу найти, посмотри кругом.

derived_from: [алав]
