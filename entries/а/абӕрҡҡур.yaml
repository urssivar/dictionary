headword: абӕрҡҡур
ipa: abæɾˈqːuɾ
tags: [adj, cls, vb]
forms:
  - text: абӕрҡҡул
    gloss: adv

definitions:
  - translation:
      en: uncultured
      ru: невоспитанный
    aliases:
      en: [boorish, rude]
      ru: [бескультурный, грубый]

etymology:
  en: The negative preterite of *руҡҡяра* "to educate, to bring up".
  ru: Отрицательный претерит от *руҡҡяра* "воспитывать".

derived_from: [руҡҡӕра]
