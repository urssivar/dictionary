headword: ағзин
ipa: aʁˈzin
tags: [n, loan, turkic]
forms:
  - text: ағзинте
    gloss: pl

definitions:
  - translation:
      en: idler
      ru: бездельник
    aliases:
      en: [loafer, slacker, layabout]
      ru: [лентяй]

etymology:
  en: From Kumyk *азгъын* "dissolute, feeble".
  ru: От кумыкского *азгъын* "беспутный, немощный".

variants: [азғин]
