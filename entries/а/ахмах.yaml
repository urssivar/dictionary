headword: ахмах
ipa: aχˈmaχ
tags: [n, loan, arabic]
forms:
  - text: ахмахе
    gloss: pl

definitions:
  - translation:
      en: idiot
      ru: идиот
    aliases:
      en: [fool, moron]
      ru: [дурак, болван]
    tags: [pejorative]
    examples:
      - text: Маһ һештти ахмахе.
        translation:
          en: Well, what idiots.
          ru: Ну какие же идиоты.

etymology:
  en: From Arabic أَحْمَق (*ʔaḥmaq*) "stupid".
  ru: От арабского أَحْمَق (*ʔaḥmaq*) "глупый".
