headword: азбар
ipa: azˈbaɾ
tags: [n, loan, turkic]
forms:
  - text: азбунде
    gloss: pl

definitions:
  - translation:
      en: yard
      ru: двор
    tags: [structure]
    aliases:
      en: [courtyard, enclosure, compound]
      ru: [двор, подворье, огороженное пространство]
    examples:
      - text: Машин азбари цака. #?
        translation:
          en: Drive the car into the yard.
          ru: Загони машину во двор.

etymology:
  en: From Kumyk *абзар* "yard", possibly from Persian ابزار (*abzâr*) "tool, instrument".
  ru: От кумыкского *абзар* "двор", возможно от персидского ابزار (*abzâr*) "инструмент, орудие".

variants: [шеркка]
