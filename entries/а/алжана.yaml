headword: алжана
ipa: alˈʒana
tags: [n, loan, arabic]
forms:
  - text: алжанал
    gloss: obl
  - text: алжанте
    gloss: pl

definitions:
  - translation:
      en: heaven
      ru: рай
    tags: [religion]
    aliases:
      en: [paradise]
      ru: [небеса]
    examples:
      - text: Алжанали реғав цере.
        translation:
          en: May she go to heaven.
          ru: Пусть она попадёт в рай.

etymology:
  en: From Arabic الجَنَّة (*al-janna*) "heaven".
  ru: От арабского الجَنَّة (*al-janna*) "рай".
