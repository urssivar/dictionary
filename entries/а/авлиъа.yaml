headword: авлиъа
ipa: aβliˈʔa
tags: [n, loan, arabic]
forms:
  - text: авлиъне
    gloss: pl

definitions:
  - translation:
      en: insane person
      ru: умалишённый
    aliases:
      en: [madman, lunatic]
      ru: [сумасшедший, безумец]
    tags: [pejorative]

etymology:
  en: From Arabic أولياء (*awliyāʾ*) "the beloved of God".
  ru: От арабского أولياء (*awliyāʾ*) "возлюбленные Бога".

variants: [авлиъа]
see_also: [авдал]
