headword: аҡар
ipa: aˈqar
tags: [n]
forms:
  - text: аҡрун
    gloss: obl
  - text: аҡарте
    gloss: pl

definitions:
  - translation:
      en: entry, opening
      ru: проход
    tags: [structure]
    aliases:
      en: [entrace, passage]
      ru: [вход]
    examples:
      - text: Ҡӏвәл биж берһил дәғинцци аҡар барив. #? дәғини
        translation:
          en: The cow ran and made an opening in the fence.
          ru: Корова с разбегу создали проход в заборе.

derived_from: [иҡара]
variants: [аҡре]
