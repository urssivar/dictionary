headword: аҡ
ipa: ˈaq
tags: [n]
forms:
  - text: аҡа
    gloss: obl
  - text: иҡре
    gloss: pl

definitions:
  - translation:
      en: vineyard
      ru: виноградник
    tags: [agriculture]
    aliases:
      en: [garden, grape]
      ru: [сад, виноград]
    examples:
      - text: Һана шилла аҡацци дәнне да дулшана. 
        translation:
          en: Now we are going in the village vineyard to work.
          ru: Сейчас мы идём работать на сельский виноградник.
