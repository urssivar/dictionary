headword: аһ һаһай
ipa: ˈah haˌhaj
tags: [intj]

definitions:
  - translation:
      en: dismay or astonishment (oh my, good grief, dammit)
      ru: досада или удивление (ну надо же, ничего себе, блин)
    examples:
      - text: Аһ һаһай, һежин ди пинцӏа!
        translation:
          en: Good grief, all this trash!
          ru: Ну надо же, сколько здесь мусора!

derived_from: [аһ]
