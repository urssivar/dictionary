headword: ағу
ipa: aˈʁu
tags: [n, loan, turkic]
forms:
  - text: ағуйте
    gloss: pl

definitions:
  - translation:
      en: venom
      ru: яд
    aliases:
      en: [poison]
      ru: [отрава]
    examples:
      - text: ағу чев цӏецӏе
        translation:
          en: venomous snake
          ru: ядовитая змея

etymology:
  en: From Kumyk *агъу* or Azerbaijani *ağı* "poison".
  ru: От кумыкского *агъу* или азербайджанского *ağı* "яд".
