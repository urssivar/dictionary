headword: аһабурхан
ipa: ahabuɾˈχːan
tags: [adj, vb]
forms:
  - text: аһабурхул
    gloss: adv

definitions:
  - translation:
      en: unending
      ru: нескончаемый
    aliases:
      en: [endless, infinite]
      ru: [бесконечный, вечный]
