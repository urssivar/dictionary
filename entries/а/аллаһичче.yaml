headword: Аллаһичче
ipa: alˈlahitʃːe
tags: [post, vb]

definitions:
  - translation:
      en: for God's sake
      ru: ради Бога
    examples:
      - text: Аллаһичче ватаба ду!
        translation:
          en: For God's sake leave me alone!
          ru: Ради Бога оставьте меня в покое!

variants: [Аллаһ виччен, Аллаһ ичченне]
derived_from: [аллаһ, биккара]
