headword: аккне
ipa: ˈakːne
tags: [n, vb]
forms:
  - text: аккнел
    gloss: obl

definitions:
  - translation:
      en: absence
      ru: отсутствие
    aliases:
      en: [lack]
      ru: [нехватка]
    examples:
      - text: Ҡил диг аккне дул абаһурда.
        translation:
          en: I didn't know there was no meat at home.
          ru: Я не знал, что дома нет мяса.
      - text: Ду зәипле аккне царацци мабурса.
        translation:
          en: Don't tell others that I'm not sick.
          ru: Не рассказывай другим, что я не болен.

etymology:
  en: Masdar from the historic verb *\*аккора* (cf. *акку* "not").
  ru: Масдар от исторического глагола *\*аккора* (ср. *акку* "не").

derived_from: ["*аккора"]
variants: [аккре]
see_also: [акку, биһне, аккре]
