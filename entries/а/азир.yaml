headword: азир
ipa: aˈziɾ
tags: [num, loan, iranian]

definitions:
  - translation:
      en: thousand
      ru: тысяча
    examples:
      - text: Азирна биивда — ирғул акку.
        translation:
          en: I said it a thousand times — doesn't understand.
          ru: Тысячу раз я сказал — не понимает.
      - text: Азир бала дакӏ!
        translation:
          en: A thousand troubles on you!
          ru: Тысяча бед на тебя!
      - text: Ца ғай аужив, ссәәтла уркка азир куц киһәв.
        translation:
          en: He didn’t stay on one word, he changed his mind many times over the course of an hour.
          ru: На одном слове не остался, в течение часа многократно менял мнение.

etymology:
  en: From Persian هزار (*hazâr*) "thousand".
  ru: От персидского هزار (*hazâr*) "тысяча".
