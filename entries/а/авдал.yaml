headword: авдал
ipa: aβˈdal
tags: [n, loan, arabic]
forms:
  - text: авдалте
    gloss: pl

definitions:
  - translation:
      en: fool, stupid
      ru: глупец, тупой
    aliases:
      en: [idiot, simpleton]
      ru: [дурак, идиот]
    tags: [pejorative]

etymology:
  en: From Arabic أبدال (*abdāl*) "God's saint".
  ru: От арабского أبدال (*abdāl*) "святой".

see_also: [авлиъа]
