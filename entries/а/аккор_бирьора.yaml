headword: аккор бирьора
ipa: aˌkːʷaɾ biɾˈhʷaɾa
tags: [v, ntr, cls]
forms:
  - text: биьора
    gloss: pfv
  - text: биьяв
    gloss: pret

definitions:
  - translation:
      en: to go extinct
      ru: вымирать
    aliases:
      en: [die out, disappear, vanish]
      ru: [исчезать, пропадать, уходить]
    examples:
      - text: Дуццан бицӏе аккор диьяв.
        translation:
          en: Wolves went extinct in the forest.
          ru: В лесу вымерли волки.

derived_from: [аккор, бирьора]
