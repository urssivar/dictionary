headword: асттавпирулла
ipa: asˈtːaβpiɾulla
tags: [intj, loan, arabic]

definitions:
  - translation:
      en: expressing shock or disapproval (my God!, good grief!)
      ru: выражение шока или неодобрения (господи!, боже мой!)

etymology:
  en: From Arabic أَسْتَغْفِرُ اللهَ (*ʔastaḡfiru llāha*) "I ask God for forgiveness".
  ru: От арабского أَسْتَغْفِرُ اللهَ (*ʔastaḡfiru llāha*) "прошу прощения у Бога".

variants: [асттаһпирулла]
