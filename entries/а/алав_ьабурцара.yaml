headword: алав ьабурцара
ipa: aˌlaβ habuɾˈtsaɾa
tags: [v, cls, tr]
forms:
  - text: ьабуцара
    gloss: pfv
  - text: ьабуцив
    gloss: pret

definitions:
  - translation:
      en: to surround
      ru: окружать
    aliases:
      en: [encircle]
      ru: [обводить]
    examples:
      - text: Уба цинна дяьнал алав ьаруцил разил риххул це.
        translation:
          en: The mother is kept happy surrounded by her children.
          ru: Мать окружена своими детьми и чувствует себя счастливо.

derived_from: [алав, бурцара]
