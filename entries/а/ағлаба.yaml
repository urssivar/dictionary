headword: ағлаба
ipa: aʁˈlaba
tags: [n]
forms:
  - text: ағлабан
    gloss: obl, loc
  - text: ағлабне
    gloss: pl

definitions:
  - translation:
      en: pan
      ru: сковорода
    tags: [tool]
    aliases:
      en: [skillet, kitchenware]
      ru: [посуда]
    examples:
      - text: Ағлабан ккарттушкка дерцӏа.
        translation:
          en: Fry potatoes in a pan.
          ru: Пожарь картшку в сковородке.

variants: [ағлав, йағлав]
