headword: апатӏ
ipa: aˌpatʼ
tags: [n]
forms:
  - text: апатӏе
    gloss: pl

definitions:
  - translation:
      en: norm, order
      ru: норма, порядок
    aliases:
      en: [system, measure]
      ru: [система, мера]
    examples:
      - text: Һар цикӏалла цинна апатӏ бирһор.
        translation:
          en: Everything has its measure.
          ru: У всего есть своя мера.
