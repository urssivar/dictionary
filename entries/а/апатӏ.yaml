headword: апатӏ
ipa: aˌpatʼ
tags: [n]
forms:
  - text: апатӏе
    gloss: pl

definitions:
  - translation:
      en: measure, system
      ru: мера, система #?
    examples:
      - text: Һар цикӏалла цинна апатӏ бирһор.
        translation:
          en: Everything has its measure.
          ru: У всего есть своя мера.
