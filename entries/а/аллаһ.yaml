headword: Аллаһ
ipa: alˈlah
tags: [n, loan, arabic]

definitions:
  - translation:
      en: Allah, god
      ru: Аллах, бог
    tags: [religion]
    examples:
      - text: Аллаһли цере рат.
        translation:
          en: God keep her.
          ru: Храни её Бог.

etymology:
  en: From Arabic اللّٰه (*allāh*).
  ru: От арабского اللّٰه (*allāh*).
