headword: аьлу
ipa: ˈahlu
tags: [n, loan, arabic]
forms:
  - text: аьлун
    gloss: obl
  - text: аьлуме
    gloss: pl

definitions:
  - translation:
      en: community, cohort
      ru: сообщество, когорта
    aliases:
      en: [people, group, generation]
      ru: [люди, группа, поколение]
    examples:
      - text: Алжаналла аьлунцци реғав.
        translation:
          en: May she belong to the people of paradise.
          ru: Пусть она будет из обитателей рая.

etymology:
  en: From Arabic أَهْل (*ʔahl*) "people".
  ru: От арабского أَهْل (*ʔahl*) "люди".
