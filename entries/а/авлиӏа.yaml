headword: авлиӏа
ipa: aβliˈʔa
tags: [n, loan, arabic]
forms:
  - text: авлиӏне
    gloss: pl

definitions:
  - translation:
      en: insane person
      ru: умалишённый
    tags: [pejorative]
    aliases:
      en: [madman, lunatic]
      ru: [сумасшедший, безумец]

etymology:
  en: From Arabic أولياء (*awliyāʾ*) "the beloved of God".
  ru: От арабского أولياء (*awliyāʾ*) "возлюбленные Бога".

variants: [авлийа]
see_also: [авдал]
