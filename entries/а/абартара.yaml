headword: абартара
ipa: abaɾˈtaɾa
tags: [v, tr, cls]
forms:
  - text: абатара
    gloss: pfv
  - text: абатур
    gloss: pret

definitions:
  - translation:
      en: to harass, to pester
      ru: изводить, досаждать
    aliases:
      en: [to bother, to damage]
      ru: [донимать, наносить урон]
    examples:
      - text: Чикнал ниссала тӏутӏи адартар.
        translation:
          en: The sparrows harass our grapes.
          ru: Воробьи изводят наш виноград.

etymology:
  en: Negative of *бартара* "to let, allow".
  ru: Отрицательная форма от *бартара* "давать, оставлять".

derived_from: [бартара]
