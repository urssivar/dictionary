headword: автт һабиркара
ipa: ˌaβtː habiɾˈkaɾa
tags: [v, ntr, cls]
forms:
  - text: һабикара
    gloss: pfv
  - text: һабичив
    gloss: pret

definitions:
  - translation:
      en: to feud, to clash
      ru: междуусобить, сталкиваться
    tags: [feeling]
    aliases:
      en: [to conflict]
      ru: [конфликтовать]
    examples:
      - text: Шшанте мурбе ҳал автт һабичив.
        translation:
          en: The villagers clashed over hayfields.
          ru: Сельчане столкнулись из-за сенокосов.

derived_from: [автт, биркара]
