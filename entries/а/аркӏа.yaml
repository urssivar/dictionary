headword: аркӏа
ipa: aɾˈkʼa
tags: [n]
forms:
  - text: аркӏабе
    gloss: pl

definitions:
  - translation:
      en: unfertilized, infertile
      ru: яловый, бесплодный
    tags: [agriculture]
    examples:
      - text: Идус аркӏал калгун һеж ҡӏвәл.
        translation:
          en: This year this cow was without offspring.
          ru: В этом году эта корова была без приплода.
