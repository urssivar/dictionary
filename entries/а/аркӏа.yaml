headword: аркӏа
ipa: aɾˈkʼa
tags: [n adj]
forms:
  - text: аркӏабе
    gloss: pl

definitions:
  - translation:
      en: barren, infertile
      ru: яловой, бесплодный
    tags: [agriculture]
    aliases:
      en: [infertile]
      ru: [неплодный]
    examples:
      - text: Идус аркӏал калгун һеж ҡӏвәл.
        translation:
          en:
          ru: В этмо году эта корова была без приплода.
