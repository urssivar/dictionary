headword: ахтар
ipa: aχˈtaɾ
tags: [n, loan, turkic]

definitions:
  - translation:
      en: check
      ru: проверка
    aliases:
      en: [inspection, examination]
      ru: [проверка, осмотр]
    examples:
      - text: Ушттилли дарс ахтар барив.
        translation:
          en: The teacher checked the lesson.
          ru: Учитель проверил урок.

etymology:
  en: From Kumyk *ахтармакъ* "to search".
  ru: От кумыкского *ахтармакъ* "искать".

variants: [ахтарди]
