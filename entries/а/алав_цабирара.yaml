headword: алав цабирара
ipa: aˌlaβ tsabiˈɾaɾa
tags: [v, cls, tr]
forms:
  - text: цабарара
    gloss: pfv
  - text: цабарив
    gloss: pret

definitions:
  - translation:
      en: to enclose
      ru: огораживать
    aliases:
      en: [fence, encircle, surround]
      ru: [окружить, обнести, изгородить]
    examples:
      - text: Дяғя кабяҡил ҡу алав цабарив.
        translation:
          en: Забили забор и огородили огород.
          ru: They put up a fence and enclosed the garden.

derived_from: [алав, бирара]
