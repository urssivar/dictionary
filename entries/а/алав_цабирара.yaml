headword: алав цабирара
ipa: aˌlaβ tsabiˈɾaɾa
tags: [v, cls, tr]
forms:
  - text: цабарара
    gloss: pfv
  - text: цабарив
    gloss: pret

definitions:
  - translation:
      en: to enclose
      ru: огораживать
    aliases:
      en: [fence, encircle, surround]
      ru: [окружить, обнести, изгородить]
    examples:
      - text: Дәғә кабәҡил ҡу алав цабараба.
        translation:
          en: Давайте поставим забор и огородим сад.
          ru: Let's put up a fence and enclose the garden.
  - translation:
      en: to hug (gently)
      ru: приобнимать (мягко)
    aliases:
      en: [embrace, hold]
    examples:
      - text: Аттал цинна дәһне алав цабарив.
        translation:
          en: The father gently hugged his children.
          ru: Отец приобнял своих детей.

derived_from: [алав, бирара]

