headword: асар
ipa: aˈsaɾ
tags: [n, loan, iranian]
forms:
  - text: асарте
    gloss: pl

definitions:
  - translation:
      en: impression, effect
      ru: впечатление, эффект
    aliases:
      en: [impact]
      ru: [воздействие]
    examples:
      - text: Һелела ғайли дами хула асар барив.
        translation:
          en: His words made a great impression on me.
          ru: Его слова оказали на меня большое впечатление.

etymology:
  en: From Persian اثر (*asar*), from Arabic أَثَر (*ʔaṯar*) "trace, impression".
  ru: От персидского اثر (*asar*), от арабского أَثَر (*ʔaṯar*) "след, впечатление".
