headword: анкӏ кабиргара
ipa: ˌankʼ kabiɾˈgaɾa
tags: [v, ntr, cls]
forms:
  - text: кабигара
    gloss: pfv
  - text: кабижив
    gloss: pret

definitions:
  - translation:
      en: to doze
      ru: кимарить
    aliases:
      en: [to sleep, to nap]
      ru: [спать, дремать]
    examples:
      - text: Ҳуней чиһе, анкӏ макирга.
        translation:
          en:
          ru:

etymology:
  en: Shares the root with *анкӏала* "sleep".
  ru: Общий корень с *анкӏала* "сон".

variants: [~ кабаҳара, чи буссана]
derived_from: ["*анкӏ", кабиргара]
see_also: [анкӏала]
