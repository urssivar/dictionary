headword: анкӏ кабиргара
ipa: ˌankʼ kabiɾˈgaɾa
tags: [v, ntr, cls]
forms:
  - text: кабигара
    gloss: pfv
  - text: кабижив
    gloss: pret
  - text: кабаҳара
    gloss: hab

definitions:
  - translation:
      en: to doze off
      ru: кимарить
    tags: [feeling]
    aliases:
      en: [to sleep, to nap]
      ru: [спать, дремать]
    examples:
      - text: Ҳуней чиһе, анкӏ макирга.
        translation:
          en: Watch the road, don't doze off.
          ru: Следи за дорогой, не кимарь.

etymology:
  en: Shares the root with *анкӏала* "sleep".
  ru: Общий корень с *анкӏала* "сон".

derived_from: ["*анкӏ", биргара, баҳара]
variants: [чи буссана]
see_also: [анкӏала]
