headword: аргара
ipa: aɾˈgaɾa
tags: [v, ntr]
forms:
  - text: агара
    gloss: pfv
  - text: агур
    gloss: pret

definitions:
  - translation:
      en: to happen
      ru: случаться
    aliases:
      en: [to occur, to take place]
      ru: [происходить]
    examples:
      - text: Церра аарганне етти.
        translation:
          en: Nothing will happen to you.
          ru: Ничего с тобой не случится.
  - translation:
      en: to work out
      ru: получаться
    aliases:
      en: [to succeed, to manage]
      ru: [удаваться]
    examples:
      - text: Агур у ила?
        translation:
          en: Did you manage it?
          ru: Получилось у тебя?
  - translation:
      en: to become
      ru: становиться
    examples:
      - text: Иригле ду дирихтур агурда.
        translation:
          en: Last year I became director.
          ru: В прошлом году я стал директором.

### агни «наметка» от агана «наметать».
