headword: арһе
ipa: ˈaɾhe
tags: [n]
forms:
  - text: арһин
    gloss: obl
  - text: арһиппе
    gloss: pl

definitions:
  - translation:
      en: saw
      ru: пила
    tags: [tool]
    examples:
      - text: Арһинццил хор чӏубаг барив.
        translation:
          en: Halved the log with a saw.
          ru: Распилил бревно пополам пилой.

variants: [арһни/арһнил-/арһнибе]
