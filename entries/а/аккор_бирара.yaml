headword: аккор бирара
ipa: aˌkːʷaɾ biˈɾaɾa
tags: [v, tr, cls]
forms:
  - text: барара
    gloss: pfv
  - text: барив
    gloss: pret

definitions:
  - translation:
      en: to exterminate, to destroy
      ru: истреблять, уничтожать
    aliases:
      en: [to kill, to eliminate]
      ru: [убивать, ликвидировать]
    examples:
      - text: Дарманла дарил сукке ппиғне аккор дарив.
        translation:
          en: Treated them with drug and destroyed all the beetles.
          ru: Обработал лекарством и истребил всех жуков.

derived_from: [аккор, бирһора]
