headword: азиранцци
ipa: aˈziɾantsːi
tags: [adv]

definitions:
  - translation:
      en: among countless others
      ru: среди бесчисленного множества
    aliases:
      en: [innumerable, thousands]
      ru: [неисчислимый, тысячи]
    examples:
      - text: Азиранцци һелгон вейкку.
        translation:
          en: There is no such one among countless others.
          ru: Такого нет среди бесчисленного множества других.

derived_from: [азир]
see_also: [суккенцци]
