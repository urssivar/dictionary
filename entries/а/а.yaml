headword: а
ipa: ˈa
tags: [conj, loan, russian]

definitions:
  - translation:
      en: but, and
      ru: а, но
    examples:
      - text: Дул һеж биранда, а ил һел бара.
        translation:
          en: I will do this, and you do that.
          ru: Я сделаю это, а ты сделай то.

etymology:
  en: From Russian *а* "but, and".
  ru: От русского *а*.
