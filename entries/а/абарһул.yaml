headword: абарһул
ipa: ˈabaɾhul
tags: [adv, vb]

definitions:
  - translation:
      en: inadvertently
      ru: нечаянно
    aliases:
      en: [accidentally, unintentionally]
      ru: [случайно, невольно]
    examples:
      - text: абарһул барив
        translation:
          en: did inadvertently
          ru: сделал нечаянно

etymology:
  en: The negative progressive of *барьара* "to know".
  ru: Отрицательная продолженная форма от *барьара* "знать".

derived_from: [барһара]
