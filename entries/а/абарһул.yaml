headword: абаһул
ipa: ˈabahul
tags: [adv, vb]

definitions:
  - translation:
      en: inadvertently
      ru: нечаянно
    aliases:
      en: [accidentally, unintentionally]
      ru: [случайно, невольно]
    examples:
      - text: абаһул барив
        translation:
          en: did inadvertently
          ru: сделал нечаянно

etymology:
  en: The negative past participle of *барьара* "to know".
  ru: Отрицательное прошедшее деепричастие от *барьара* "знать".

variants: [абарһул] 
derived_from: [барһара]
