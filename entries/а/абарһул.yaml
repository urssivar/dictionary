headword: абарһул
ipa: ˈabaɾhul
tags: [adv, vb]

definitions:
  - translation:
      en: inadvertently
      ru: нечаянно
    aliases:
      en: [accidentally, unintentionally]
      ru: [случайно, невольно]
    examples:
      - text: абаһул барив
        translation:
          en: did inadvertently
          ru: сделал нечаянно

etymology:
  en: Negative converb of *барһара* "to know".
  ru: Отрицательное деепричастие от *барһара* "знать".

variants: [абаһул] 
derived_from: [барһара]
