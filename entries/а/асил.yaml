headword: асил
ipa: aˈsil
tags: [adj]

definitions:
  - translation:
      en: worthy, deserving, superior
      ru: достойный, заслуживающий, превосходный
    examples:
      - text: Һәх цилла асилил йе?
        translation:
          en: How is he better?
          ru: Он чем лучше?

derived_from: [ас]
