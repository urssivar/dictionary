headword: асҡҡаҡҡ
ipa: asˈqːaqː
tags: [adj]
forms:
  - text: асҡҡаҡҡе
    gloss: pl

definitions:
  - translation:
      en: disabled, cripple
      ru: инвалид, калека
    aliases:
      en: [miserable, pitiful]
      ru: [жалкий, несчастный]
    examples:
      - text: Дәвцци вәрун асҡҡаҡҡ агул цағив.
        translation:
          en: He went to war and returned disabled.
          ru: Ушёл на войну и вернулся инвалидом.
