headword: абикк бирһора
ipa: ˌabikː biɾˈhʷaɾa
tags: [v, ntr, cls]
forms:
  - text: биһора
    gloss: pfv
  - text: биһәв
    gloss: pret

definitions:
  - translation:
      en: to come to dislike
      ru: разонравиться
    tags: [feeling]
    examples:
      - text: Һел дами авикк виһәв.
        translation:
          en: I came to dislike him.
          ru: Он мне разонравился.

derived_from: [биккара, бирһора]
