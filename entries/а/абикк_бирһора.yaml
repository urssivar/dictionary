headword: абикк бирһора
ipa: ˌabikː biɾˈhʷaɾa
tags: [v, ntr, cls]
forms:
  - text: биһора
    gloss: pfv
  - text: биһәв
    gloss: pret

definitions:
  - translation:
      en: to come to dislike
      ru: разонравиться
    tags: [feeling]
    aliases:
      en: [to get disenchanted, to get disappointed]
      ru: [разочароваться]
    examples:
      - text: Һел дами авикк виһәв.
        translation:
          en: I came to dislike him.
          ru: Он мне разонравился.

etymology:
  en: Negative stem of *биккара* "to want".
  ru: Отрицательная основа от *биккара* "хотеть".

derived_from: [биккара, бирһора]
