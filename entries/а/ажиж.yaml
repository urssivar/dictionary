headword: ажиж
ipa: aˈʒiʒ
tags: [adj, vb]

definitions:
  - translation:
      en: probable, possible
      ru: вероятный, возможный
    aliases:
      en: [likely]
    examples:
      - text: Ижал марка ажижле це.
        translation:
          en: Possible rain today.
          ru: Сегодня возможен дождь.

etymology:
  en: Hypothetical participle of *аргара* "to happen".
  ru: Гипотетическое причастие от *аргара* "случаться".

derived_from: [аргара]
