headword: абиккан аргара
ipa: abiˌkːan aɾˈgaɾa
tags: [v, ntr]
forms:
  - text: агара
    gloss: pfv
  - text: агур
    gloss: pret

definitions:
  - translation:
      en: to feel awkward, to be embarrassed
      ru: чувствовать себя неловко, смущаться
    tags: [feeling]
    aliases:
      en: [inconvenience, disillusionment]
      ru: [неудобство, расстройство]
    examples:
      - text: Абиккан агул бәәде, цӏил чер дерхой икӏул цағив.
        translation:
          en: Apparently he felt embarrassed, then he came asking for forgiveness.
          ru: Видимо ему стало неловко, потом пришёл прося прощения.

etymology:
  en: Negative present participle of *биккара* "to want" (cf. *биккан* "wish").
  ru: Отрицательное настоящее причастие от *биккара* "хотеть" (ср. *биккан* "желание").

derived_from: [биккара, аргара]
see_also: [биккан]
