headword: арх
ipa: ˈaɾχ
tags: [n]
forms:
  - text: архни
    gloss: loc
  - text: ирхре
    gloss: pl

definitions:
  - translation:
      en: crevice, gorge
      ru: расщелина, теснина
    examples:
      - text: Хвәр верттил архни кагур.
        translation:
          en: Slipped and fell into a crevice.
          ru: Соскользнул и провалился в расщелину.

