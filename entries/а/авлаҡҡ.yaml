headword: авлаҡҡ
ipa: aβˈlaqː
tags: [n, loan, turkic]
forms:
  - text: авлаҡҡе
    gloss: pl

definitions:
  - translation:
      en: valley
      ru: долина
    tags: [nature]
    aliases:
      en: [plain, field]
      ru: [равнина, поле]
    examples:
      - text: Еҡӏе би авлаҡҡи буккун.
        translation:
          en: The herd grazes in the valley.
          ru: Стадо посётся на долине.

etymology:
  en: From Kumyk *авлакъ* "field, open land".
  ru: От кумыкского *авлакъ* "поле, открытая местность".
