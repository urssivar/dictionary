headword: алав
ipa: aˈlaβ
tags: [post]

definitions:
  - translation:
      en: around
      ru: вокруг
    aliases:
      en: [about, round]
      ru: [кругом, округ]
    examples:
      - text: Дәһне ҡалла алав дуцӏ бикӏул биде.
        translation:
          en: The children were running around the house.
          ru: Дети бегали вокруг дома.
