headword: авттабуз
ipa: aβtːaˈbuz
tags: [n, loan, russian]
forms:
  - text: авттабузе
    gloss: pl

definitions:
  - translation:
      en: bus
      ru: автобус
    tags: [technology]
    aliases:
      en: [vehicle]
      ru: [транспорт]
    examples:
      - text: Дәһне авттабузли цачив.
        translation:
          en: The bus brought the children.
          ru: Автобус привёз детей.
etymology:
  en: From Russian *автобус* "bus".
  ru: От русского *автобус*.
