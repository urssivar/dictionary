headword: акка иҡара
ipa: aˌkːa iˈqaɾa
tags: [v, ntr]
forms:
  - text: аҡара
    gloss: pfv
  - text: аҡив
    gloss: pret

definitions:
  - translation:
      en: to part, to say goodbye
      ru: прощаться, расходиться
    aliases:
      en: [leave, separate]
      ru: [расставаться, уходить]
    examples:
      - text: Миҡҡла һереғ укка акка аҡил бегур.
        translation:
          en: After the wedding, people said goodbye and left.
          ru: После свадьбы люди попрощались и ушли.

variants: [~ биҡара/беҡара/беҡив]
derived_from: [акка, иҡара]
