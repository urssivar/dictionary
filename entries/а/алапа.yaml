headword: алапа
ipa: aˈlapa
tags: [n, loan]
forms:
  - text: алапан
    gloss: obl

definitions:
  - translation:
      en: wage, payment
      ru: оплата, плата
    aliases:
      en: [price]
      ru: [зарплата, цена]
    examples:
      - text: Усттал цинела әчулла алапа һассив.
        translation:
          en: The master took the wage for his work.
          ru: Мастер взял оплату за свою работу.

