headword: алапа
ipa: aˈlapa
tags: [n, loan]
forms:
  - text: алапан
    gloss: obl

definitions:
  - translation:
      en: wage
      ru: оплата
    aliases:
      en: [payment, price]
      ru: [зарплата, цена]
    examples:
      - text: Усттал цинел таман барив әчулла алапа һассив.
        translation:
          en: The master took the wage for his finished work.
          ru: Мастер взял оплату за свою завершённую работу.
