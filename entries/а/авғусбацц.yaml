headword: авғусбацц
ipa: aβˈʁusbatsː
tags: [n, loan, russian]
forms:
  - text: авғусбацце
    gloss: obl
  - text: авғусбиццре
    gloss: pl

definitions:
  - translation:
      en: August
      ru: август
    tags: [time]
    aliases:
      en: [month]
      ru: [месяц]
    examples:
      - text: Авғусбаццей барил әһле де.
        translation:
          en: It would be good to do it before August.
          ru: До августа хорошо бы сделать.

etymology:
  en: From Russian *август* "August" and Kaitag *бацц* "month".
  ru: От русского *август* и кайтагского *бацц* "месяц".

variants: [авғустт]
derived_from: [бацц]
