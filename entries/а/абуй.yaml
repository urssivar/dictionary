headword: абуй
ipa: aˈbuj
tags: [n, loan, russian]
forms:
  - text: абуйте
    gloss: pl

definitions:
  - translation:
      en: wallpaper
      ru: обои
    examples:
      - text: Ниссал ижал абуйте чидяҡивда.
        translation:
          en: Today we pasted wallpapers.
          ru: Сегодня мы приклеили обои.

etymology:
  en: From Russian *обои* "wallpaper" (pl.), reanalyzed as singular.
  ru: От русского *обои* (мн. ч.), переосмыслено как ед. ч.
