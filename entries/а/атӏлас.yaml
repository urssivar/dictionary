headword: атӏлас
ipa: ˈatʼlas
tags: [n, loan, arabic]
forms:
  - text: атӏлассе
    gloss: pl

definitions:
  - translation:
      en: atlas (fabric)
      ru: атлас (ткань)
    tags: [fabric]
    aliases:
      en: [silk, satin]
      ru: [шёлк, сатин]

etymology:
  en: From Arabic أَطْلَس (*ʔaṭlas*) "satin".
  ru: От арабского أَطْلَس (*ʔaṭlas*) "атлас".
