headword: арцӏе
ipa: ˈaɾtsʼe
tags: [n, vb]
forms:
  - text: арцӏе
    gloss: nom, loc
  - text: арцӏи
    gloss: obl
  - text: арцӏне
    gloss: pl

definitions:
  - translation:
      en: weeding
      ru: прополка
    tags: [agriculture]
    examples:
      - text: арцӏе вәнара
        translation:
          en: to go weeding
          ru: пойти на прополку
  - translation:
      en: overgrown field
      ru: заросшее поле
    examples:
      - text: Даҡил арцӏне чи дичил це дами идус.
        translation:
          en: Lots of overgrown fields this year for me.
          ru: Много заросших полей в этом году для меня.

derived_from: [ирцӏара]
see_also: [арше]
