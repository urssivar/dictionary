headword: айланди
ipa: ajlanˈdi
tags: [n, loan, turkic]
forms:
  - text: айландил
    gloss: obl

definitions:
  - translation:
      en: dancing circle
      ru: танцевальный круг
    tags: [culture]
    aliases:
      en: [round dance, circle dance]
      ru: [хоровод, круговой танец]
    examples:
      - text: Айландилжи цәбун бази барара.
        translation:
          en: Came to the circle to dance.
          ru: Пришли на круг танцевать.

etymology:
  en: From Kumyk *айландыр* "rotation".
  ru: От кумыкского *айландыр* "вращение".

variants: [ҡҡайландир]
