headword: аһ бикӏора
ipa: ˌah biˈkʼʷaɾa
tags: [v, ntr, cls]

definitions:
  - translation:
      en: to moan, to be unwell
      ru: стонать, недомогать
    aliases:
      en: [to be sick]
      ru: [болеть]
    examples:
      - text: Әрти һәйгон цӏаҡӏле аһ бикӏул це, хол буҡен абиҡҡар.
        translation:
          en: The spotted cow is moaning a lot and won't last long.
          ru: Пятнистая корова сильно стонет, долго не протянет.

derived_from: [аһ, бикӏора]
