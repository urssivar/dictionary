headword: адаһрей
ipa: adahˈɾej
tags: [n, vb]
forms:
  - text: адаһрейте
    gloss: pl

definitions:
  - translation:
      en: ignorance
      ru: неведение

etymology:
  en: From the negative of *барьара* "to know".
  ru: От отрицательной формы *барьара* "знать".

variants: [адаһре/адаһрел-/адаһрибе, адаһунде]
derived_from: [барһара]
