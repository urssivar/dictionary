headword: ахир
ipa: aˈχiɾ
tags: [n, loan, arabic]
forms:
  - text: ахирте
    gloss: pl

definitions:
  - translation:
      en: end
      ru: конец
    aliases:
      en: [finish, conclusion]
      ru: [финал, завершение]
    examples:
      - text: хабарла ахир
        translation:
          en: the story's end
          ru: конец рассказа

etymology:
  en: From Arabic آخِر (*ʔāḵir*) "last".
  ru: От арабского آخِر (*ʔāḵir*) "последний".

variants: [әхир]
