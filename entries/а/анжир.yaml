headword: анжир
ipa: anˈʒiɾ
tags: [n, loan, iranian]
forms:
  - text: анжирте
    gloss: pl

definitions:
  - translation:
      en: fig
      ru: инжир
    tags: [fruit]
    aliases:
      ru: [фига]
    note:
      en: no plural form
      ru: без формы мн. ч.
  - translation:
      en: fig tree
      ru: инжировое дерево
    aliases:
      ru: [смоковница]
    tags: [tree]

etymology:
  en: From Persian انجیر (*anjir*) "fig".
  ru: От персидского انجیر (*anjir*) "инжир".
