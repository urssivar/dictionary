headword: чун
ipa: ˈtʃun
tags: [adv, num]
note:
  en: "*чум*"
definitions:
  - translation:
      en: how many
      ru: сколько
    examples:
      - text: cӕӕт чунцци?
        translation:
          en: at what hour?
      - text: чунжи йа?
        translation:
          en: what's the price?
      - text: чун һинце дажил ей?
        translation:
          en: how many apples are needed?
