headword: черикӏ
ipa: tʃeˈɾikʼ
tags: [adj]

definitions:
  - translation:
      en: fastidious
      ru: привередливый
    aliases:
      en: [choosy, fussy]
      ru: [разборчивый, брезгливый]
    examples:
      - text: Черикӏ уле суҡҡур бирьор.
        translation:
          en: The fastidious eye goes blind.
          ru: Привиредлевый глаз ослепнет.

derived_from: [чер ьабикӏара]
