headword: унцӏер
ipa: unˈtsʼeɾ
tags: [n, vb]
etymology:
  en: From *увцьара* "to research".
definitions:
  - translation:
      en: scan
      ru: поиск
    aliases:
      en: [search, seek]
    examples:
      - text: ҡӏвәлай унцӏер вәрун
        translation:
          en: went to scan for the cows
