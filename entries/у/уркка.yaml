headword: уркка
ipa: uɾˈkːa
tags: [adv]
definitions:
  - translation:
      en: between
      ru: между
    aliases:
      en: [among]
  - translation:
      en: in a moment
      ru: в моменте
    examples:
      - text: һел уркка һелтти ра цабағив
        translation:
          en: in that moment they too arrived

### ца уркка, в один момент \ уркка момент, мн.ч.?
