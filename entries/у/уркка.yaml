headword: уркка
ipa: uɾˈkːa
tags: [adv, n]

definitions:
  - translation:
      en: between
      ru: между
    aliases:
      en: [among]
  - translation:
      en: moment, instant
      ru: момент, мгновение
    examples:
      - text: Һел уркка һелтти ра цабағив.
        translation:
          en: At that moment they arrived too.
          ru: В тот момент и они приехали.
      - text: Бизи биде, цӏил ца уркка берҡӏив.
        translation:
          en: There was a cat, then one moment it disappeared.
          ru: Была кошка, потом в один момент исчезла.
