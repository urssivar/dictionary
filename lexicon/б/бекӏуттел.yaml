headword: бекӏуттел
ipa: ˈbekʼutːel
tags: [adv]
etymology:
  en: From *бекь* "head", the second part is related to *гуни* "below".
variants:
  - text: бекӏ гуттер
  - text: бекӏ саттинне
definitions:
  - translation:
      en: upside down
      ru: вверх ногами
    aliases:
      en: [bottom, up]
    examples:
      - text: ттартт бяҡил бекӏуттел кагур 
