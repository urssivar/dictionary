headword: бугара
ipa: buˈgaɾa
tags: [v, ntr, cls]
forms:
  - text: бужив
    gloss: pret
  - text: бугара
    gloss: ipfv
definitions:
  - translation:
      en: to stay
      ru: оставаться
    examples:
      - text: ьелин буже
      - text: берцӏив удар акабичил абугар
  - translation:
      en: успокаваться, соглашаться
    examples:
      - text: циней тилпун бичен угар
