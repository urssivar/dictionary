id: m5Kdye2Z5YH5eNaXIG3zi
headword: бацӏле
ipa: ˈbatsʼle
tags: [adv, cls]
definitions:
  - translation:
      en: plainly, just that (about eating)
      ru: просто, чисто это (о еде)
    examples:
      - text: аугул вааттал, дацӏле нерғ дерчча
        translation:
          en: if you're not agreeing, eat just the soup (e.g. without bread)
      - text: дул чяй дацӏле дуччид
        translation:
          en: I drink plain tea (e.g. without sugar)
