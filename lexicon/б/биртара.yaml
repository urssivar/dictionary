headword: биртара
ipa: biɾˈtaɾa
tags: [v, tr, cls]
forms:
  - text: битара
    gloss: pfv
  - text: битив
    gloss: pret
  - text: биртара
    gloss: ipfv
definitions:
  - translation:
      en: to beat up
      ru: избивать
    aliases:
      en: [break]
    examples:
      - text: урши витив
        translation:
          en: they beat up the boy
  - translation:
      en: to pound
      ru: толочь, отбиваня
    aliases:
      en: [crush]
    examples:
      - text: ччашин барара шерже дита
        translation:
          en: to pound wheat
      - text: битив диг
        translation:
          en: minced meat
