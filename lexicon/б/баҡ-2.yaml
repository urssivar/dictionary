id: WllFC6QZpsfp2QBQtgSh
headword: баҡ
ipa: ˈbaq
tags: [adv]
etymology:
  en: May be related to *баҡ* "multiple".
definitions:
  - translation:
      en: too
      ru: слишком
    aliases:
      en: [overly, much]
    examples:
      - text: баҡ явра ғай дарив ҡӏал
        translation:
          en: talked too much
          ry: чрезчур много разговаривал
      - text: баҡ дурҡал це асара
        translation:
          en: too expensive to buy
