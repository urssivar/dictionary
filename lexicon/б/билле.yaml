headword: билле
ipa: ˈbille
tags: [adv, cls]
etymology:
  en: From cop. *би* "to be".
definitions:
  - translation:
      en: while
      ru: в то время как
    aliases:
      en: [during, because, as]
    examples:
      - text: улчӏун вилле ушли ра
        translation:
          en: worked while studying
      - text: атта ҡил вилле уцци ра цяун
        translation:
          en: brother came too while father was home
