headword: булгана
ipa: bulˈgana
tags: [v, tr, cls]
note:
  en: "*лугана* (IPFV)"

forms:
  - text: балгана
    gloss: pfv
  - text: балгун
    gloss: pret
  - text: булгана
    gloss: ipfv
definitions:
  - translation:
      en: to furnish, decorate
      ru: обставлять, наряжать
    aliases:
      en: [decorate]
    examples:
      - text: балгун ҡале
  - translation:
      en: to charge
      ru: заряжать, подготовить
    aliases:
      en: [prepare]
    examples:
      - text: тупанг балга
        translation:
          en: charge the rifle
