id: Dpd45wVIf5ZR5ijHQPSs
headword: ахрей биркара
ipa: aχˌɾej biɾˈkaɾa
tags: [v, ntr, cls]
forms:
  - text: бикара
    gloss: pfv
  - text: бичив
    gloss: pret

definitions:
  - translation:
      en: to nap
      ru: дремать
    aliases:
      en: [to doze, to snooze]
      ru: [вздремнуть]
    examples:
      - text: Нишшай ьереғ кижил ахрей вичивда.
        translation:
          en: I napped waiting for you.
          ru: Ожидая вас я задремал.

etymology:
  en: "*ахрей* does not occur independently."
  ru: "*ахрей* не встречается самостоятельно."

derived_from: [биркара]
see_also: [анкӏ кабиргара]
