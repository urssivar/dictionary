id: cKRgDEBlRXuehzDXTBaY
headword: авадан
ipa: aβaˈdan
tags: [adj, loan, iranian]

definitions:
  - translation:
      en: vast
      ru: обширный
    aliases:
      en: [broad, extensive, spacious]
      ru: [широкий, просторный]
  - translation:
      en: rich
      ru: богатый
    aliases:
      en: [wealthy]
      ru: [состоятельный]
    examples:
      - text: Убала уцци авадан виьяв.
        translation:
          en: Uncle got rich.
          ru: Дядя разбогател.

etymology:
  en: From Persian آبادان (*ābādān*) "thriving, prosperous".
  ru: От персидского آبادان (*ābādān*) "процветающий".
