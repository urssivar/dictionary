id: cKRgDEBlRXuehzDXTBaY
headword: авдан
ipa: aβˈdan
tags: [adj, loan, iranian]
variants:
  - text: авадан

definitions:
  - translation:
      en: vast
      ru: обширный
    aliases:
      en: [broad, extensive, spacious]
      ru: [широкий, просторный]
  - translation:
      en: rich
      ru: богатый
    aliases:
      en: [wealthy]
      ru: [состоятельный]
    examples:
      - text: Убала уцци авдан виьяв.
        translation:
          en: Mother's brother got rich.
          ru: Брат мамы разбогател.

etymology:
  en: From Persian آبادان (*ābādān*) "thriving, prosperous".
  ru: От персидского آبادان (*ābādān*) "процветающий".
