headword: алав цабиргара
ipa: aˌlaβ tsabiɾˈgaɾa
tags: [v, ntr, cls]
forms:
  - text: цабигара
    gloss: pfv
  - text: цабижив
    gloss: pret

definitions:
  - translation:
      en: to gather
      ru: собираться
    aliases:
      en: [meet, congregate]
      ru: [собраться, встретиться, сходиться]
    examples:
      - text: Рирсбе алав цабижил азбар унзу барив.
        translation:
          en: Girls gathered and cleaned the yard.
          ru: Девушки собрались и почистили двор.

derived_from: [алав, биргара]
