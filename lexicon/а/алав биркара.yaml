id: IYu5QKbTzUYVY3EpI5XD
headword: алав биркара
ipa: aˌlaβ biɾˈkaɾa
tags: [v, cls, ntr]
forms:
  - text: бикара
    gloss: pfv
  - text: бичив
    gloss: pret

definitions:
  - translation:
      en: to evade, to dodge
      ru: уклоняться, уворачиваться
    aliases:
      en: [hedge, prevaricate]
      ru: [избегать, увиливать]
    examples:
      - text: Ьярьянцци тта алав вичив.
        translation:
          en: He dodged a bullet.
          ru: Он уклонился от пули.

derived_from: [алав, бикара]
