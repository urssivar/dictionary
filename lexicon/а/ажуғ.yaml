headword: ажуғ
ipa: aˈʒuʁ
tags: [n, loan, turkic]
forms:
  - text: ажуғе
    gloss: pl

definitions:
  - translation:
      en: spite
      ru: злоба
    tags: [feeling]
    aliases:
      en: [malice, rancor, resentment]
      ru: [злость, ненависть, гнев]
    examples:
      - text: ажуғ чикабуцил
        translation:
          en: harboring spite
          ru: затаив злобу

etymology:
  en: From Azerbaijani *acıq* "spite".
  ru: От азербайджанского *acıq* "злоба".
