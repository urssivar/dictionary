headword: асттаьпила
ipa: asˈtːahpila
tags: [intj, loan, arabic]

definitions:
  - translation:
      en: exclamation of shock or disapproval (my God!, good grief!)
      ru: восклицание неодобрения или шока (господи!, боже мой!)

etymology:
  en: From Arabic أَسْتَغْفِرُ اللهَ (*ʔastaḡfiru llāha*) "I ask God for forgiveness".
  ru: От арабского أَسْتَغْفِرُ اللهَ (*ʔastaḡfiru llāha*) "прошу прощения у Бога".
