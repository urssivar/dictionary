headword: аххал
ipa: aˈχːal
tags: [n]
forms:
  - text: аххле
    gloss: pl

definitions:
  - translation:
      en: guest
      ru: гость
    aliases:
      en: [visitor]
      ru: [посетитель, кунак]
  - translation:
      en: kunak
      ru: кунак
    examples:
      - text: Ьет шшилцци ниссала яь аххле би.
